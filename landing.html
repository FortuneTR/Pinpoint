<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pinpoint — Where We Going?</title>
<meta name="description" content="Pinpoint: an interactive atlas of the United States. Scroll in.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0B1013; --ink2:#131C22; --line:#24333C;
    --brass:#D9A441; --brass-d:#A87A28; --teal:#4FB0A5;
    --city:#6FA8DC; --parch:#ECE6D8; --mute:#8A9BA5;
    --sky-top:#1E6FD9; --sky-mid:#4FA8E0; --sky-low:#8FCBEF; --sky-horizon:#E3F4FF;
  }
  *{box-sizing:border-box;}
  /* NOTE: deliberately no overflow-x:hidden on html/body — setting overflow
     on either axis here forces the other axis to behave as 'auto' per the
     CSS Overflow spec, which turns html/body into their own scroll
     containers and breaks .stage's position:sticky (it then sticks
     relative to that inner container instead of the real viewport scroll).
     Horizontal spill is instead contained per-frame via .frame's own
     overflow:hidden below. */
  html,body{margin:0;padding:0;background:var(--sky-horizon);color:var(--parch);
    font-family:'Fredoka',ui-rounded,'Baloo 2',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;width:100%;}

  /* ===================================================================
     Base (no-JS / reduced-motion) layout: a normal stacked static page.
     Cinematic mode is an enhancement applied via the html.js-cinematic
     class once JS confirms it can run and the visitor hasn't asked for
     reduced motion. Everything below degrades gracefully without it.
     =================================================================== */

  .wrapper{position:static;}
  .stage{position:static;}
  .frame{position:relative;min-height:100vh;overflow:hidden;}

  /* ---- shared sky background: both scenes live in the same blue-sky
     world, so this single gradient backs the whole journey — no
     day-to-night crossfade any more. ------------------------------- */
  .sky-bg{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 38%,var(--sky-low) 72%,var(--sky-horizon) 100%);}

  /* ---- scene 1: sky + clouds + headline ---------------------------- */
  .frame-sky{display:flex;align-items:center;justify-content:center;}

  .clouds{position:absolute;inset:0;pointer-events:none;}
  .cloud-wrap{position:absolute;}
  .cloud{position:relative;background:#fff;border-radius:999px;
    box-shadow:0 18px 40px rgba(20,60,90,.18);
    animation:drift 32s ease-in-out infinite alternate;}
  .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;}
  @keyframes drift{from{transform:translateX(-14px);}to{transform:translateX(14px);}}

  .cloud--a{width:clamp(120px,26vw,260px);height:clamp(42px,8vw,86px);}
  .cloud--a:before{width:58%;height:170%;top:-70%;left:8%;}
  .cloud--a:after{width:70%;height:200%;top:-95%;right:4%;}

  .cloud--b{width:clamp(90px,19vw,190px);height:clamp(32px,6vw,62px);}
  .cloud--b:before{width:55%;height:160%;top:-60%;left:10%;}
  .cloud--b:after{width:62%;height:180%;top:-80%;right:8%;}

  .cloud--c{width:clamp(70px,14vw,140px);height:clamp(24px,4.5vw,46px);}
  .cloud--c:before{width:60%;height:150%;top:-55%;left:12%;}
  .cloud--c:after{width:60%;height:160%;top:-65%;right:10%;}

  .cloud-1{left:4%;top:16%;animation-delay:-2s;}
  .cloud-1 .cloud{animation-duration:60s;}
  .cloud-2{left:58%;top:10%;animation-delay:-9s;}
  .cloud-2 .cloud{animation-duration:48s;}
  .cloud-3{left:30%;top:30%;animation-delay:-4s;}
  .cloud-3 .cloud{animation-duration:42s;}
  .cloud-4{left:74%;top:34%;animation-delay:-14s;}
  .cloud-4 .cloud{animation-duration:54s;}
  .cloud-5{left:14%;top:46%;animation-delay:-6s;}
  .cloud-5 .cloud{animation-duration:38s;}
  .cloud-6{left:48%;top:52%;animation-delay:-11s;}
  .cloud-6 .cloud{animation-duration:46s;}

  /* pointer-events:none unconditionally: hero-text has no interactive
     children, and in cinematic mode it fades to opacity:0 but stays laid
     out in the same centered spot as the scene-2 gateway card — without
     this, the invisible headline would still intercept clicks meant for
     the search input/buttons underneath it. */
  .hero-text{position:relative;z-index:5;text-align:center;padding:0 20px;
    max-width:1000px;pointer-events:none;}
  .scroll-hint{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;
    text-transform:uppercase;color:rgba(255,255,255,.85);margin:0 0 18px;
    text-shadow:0 2px 10px rgba(10,30,50,.4);animation:bob 1.8s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

  .headline{margin:0;font-weight:700;line-height:1;color:#fff;
    font-size:clamp(44px,12vw,150px);letter-spacing:.5px;
    text-shadow:0 2px 0 rgba(11,16,19,.18),0 3px 0 rgba(11,16,19,.18),
      0 18px 50px rgba(11,16,19,.3),0 2px 22px rgba(255,255,255,.35);}
  .subtitle{margin:18px 0 0;font-size:clamp(16px,3.2vw,26px);font-weight:500;
    color:rgba(255,255,255,.95);text-shadow:0 4px 18px rgba(11,16,19,.3);}

  /* ---- scene 2: same sky, a real entry point into the app ----------- */
  .frame-map{display:flex;align-items:center;justify-content:center;padding:24px 20px;}

  .gateway{width:min(92vw,480px);background:rgba(255,255,255,.26);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.55);border-radius:28px;
    padding:clamp(26px,5vw,40px) clamp(22px,5vw,36px);text-align:center;
    box-shadow:0 26px 60px rgba(13,55,100,.25);}

  .gateway .kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;
    text-transform:uppercase;color:rgba(11,16,19,.6);margin:0 0 16px;}

  .place-form{display:flex;flex-wrap:wrap;gap:10px;}
  .place-input{flex:1 1 200px;min-width:0;padding:14px 18px;border-radius:999px;
    border:1px solid rgba(11,16,19,.14);background:#fff;color:var(--ink);
    font-family:'Fredoka',sans-serif;font-size:16px;outline:none;
    transition:box-shadow .2s ease,border-color .2s ease;}
  .place-input::placeholder{color:#6b7f8c;}
  .place-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(79,176,165,.28);}
  .place-submit{flex:0 0 auto;padding:14px 22px;border-radius:999px;border:none;
    background:var(--ink);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:15px;cursor:pointer;transition:background .2s ease,transform .2s ease;}
  .place-submit:hover{background:var(--ink2);transform:translateY(-1px);}
  .place-submit:active{transform:translateY(0);}

  .hint{margin:12px 0 0;font-size:11.5px;color:rgba(11,16,19,.55);
    font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;}

  .or-divider{display:flex;align-items:center;gap:12px;margin:22px 0;
    color:rgba(11,16,19,.5);font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:2px;text-transform:uppercase;}
  .or-divider:before,.or-divider:after{content:"";flex:1;height:1px;background:rgba(11,16,19,.18);}

  .cta-btn{display:inline-block;padding:16px 34px;border-radius:999px;width:100%;
    background:var(--brass);color:#1a1206;text-decoration:none;font-weight:700;
    font-family:'Fredoka',sans-serif;font-size:clamp(16px,2.4vw,19px);letter-spacing:.3px;
    box-shadow:0 14px 34px rgba(217,164,65,.35);transition:transform .2s ease,box-shadow .2s ease,background .2s ease;}
  .cta-btn:hover{background:#eab857;transform:translateY(-2px);box-shadow:0 18px 40px rgba(217,164,65,.45);}
  .cta-btn:active{transform:translateY(0);}

  .site-footer{background:var(--ink2);color:var(--mute);text-align:center;
    padding:28px 20px 34px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:1.5px;border-top:1px solid var(--line);}
  .site-footer a{color:var(--teal);text-decoration:none;}
  .site-footer a:hover{text-decoration:underline;}

  /* ===================================================================
     Cinematic mode: added by JS only when it runs and the visitor has
     not requested reduced motion. Pins the stage and drives every scene
     transition off scroll position via CSS custom properties.
     =================================================================== */
  html.js-cinematic .wrapper{height:460vh;position:relative;}
  html.js-cinematic .stage{position:sticky;top:0;height:100vh;}
  html.js-cinematic .frame{position:absolute;inset:0;min-height:0;}

  html.js-cinematic .scroll-hint{opacity:calc(1 - var(--pHint,0));}
  html.js-cinematic .headline{
    opacity:calc(1 - var(--pHeadline,0));
    transform:translateY(calc(var(--pHeadline,0) * -70px)) scale(calc(1 - var(--pHeadline,0) * 0.12));
  }
  html.js-cinematic .subtitle{
    opacity:var(--pSub,0);
    transform:translateY(calc((1 - var(--pSub,0)) * 26px));
  }
  html.js-cinematic .cloud-wrap{
    opacity:calc(1 - var(--pClouds,0));
    transform:translate(calc(var(--pClouds,0) * var(--dx,0px)),
      calc(var(--pClouds,0) * -1 * (90px + var(--depth,1) * 160px)))
      scale(calc(1 + var(--pClouds,0) * 0.35));
  }
  /* frame-map is a later sibling stacked over frame-sky at the same box;
     both already share the .sky-bg gradient, so there's nothing to
     crossfade here — only frame-map's own content (the gateway card)
     needs to fade/settle in as it's scrolled to. */
  html.js-cinematic .gateway{
    opacity:var(--pGateway,0);
    transform:scale(calc(0.96 + var(--pGateway,0) * 0.04)) translateY(calc((1 - var(--pGateway,0)) * 28px));
  }
  html.js-cinematic .cta-btn{
    opacity:var(--pCta,0);
    transform:translateY(calc((1 - var(--pCta,0)) * 14px));
    pointer-events:auto;
  }

  /* respect reduced motion even if something above slips through */
  @media (prefers-reduced-motion: reduce){
    .cloud{animation:none;}
    .scroll-hint{animation:none;}
  }

  @media (max-width:480px){
    .headline{letter-spacing:0;}
    /* .place-form switches to a column; .place-input's row-mode
       "flex:1 1 200px" would otherwise apply that 200px basis to HEIGHT
       (the column's main axis), ballooning it into a huge pill. Reset
       both children to natural auto-height, full-width stacking. */
    .place-form{flex-direction:column;}
    .place-input{flex:0 0 auto;width:100%;
      /* Smaller footprint on phones — less vertical padding, slightly
         tighter radius. Font-size stays at 16px: anything smaller makes
         iOS Safari auto-zoom the page on focus. */
      padding:10px 16px;border-radius:14px;}
    .place-submit{flex:0 0 auto;width:100%;padding:10px 16px;}
    .gateway{padding:clamp(20px,5vw,28px) clamp(18px,5vw,26px);}
  }

  /* ===================================================================
     "See Map" globe-spin transition: a fixed full-screen overlay that
     intercepts the CTA click, spins a 2D-illusion globe to a stop over
     the United States, then hands off to index.html. Fully inert/hidden
     until JS flips it on (and JS never does that under reduced-motion —
     see the script block). The CSS below purely handles the visual
     states; the actual spin (background-position-x of .globe-texture)
     is driven by rAF in JS since it needs an exact, computed landing
     offset rather than a generic keyframe loop.
     =================================================================== */
  .globe-transition{position:fixed;inset:0;z-index:80;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%,var(--sky-mid) 0%,var(--sky-top) 46%,#0A2440 78%,#061324 100%);
    opacity:0;pointer-events:none;transition:opacity .35s ease;}
  .globe-transition.is-active{opacity:1;pointer-events:auto;}
  .globe-transition.is-leaving{transition:opacity .3s ease;}

  .globe-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;
    transition:transform .3s ease-in,opacity .3s ease-in;}
  .globe-transition.is-leaving .globe-stage{transform:scale(2.1);opacity:0;}

  .globe{position:relative;width:clamp(170px,46vw,300px);height:clamp(170px,46vw,300px);
    border-radius:50%;overflow:hidden;background:#0E3A63;
    box-shadow:0 10px 26px rgba(2,10,20,.3),0 40px 90px rgba(2,10,20,.55);
    transform:scale(.8);opacity:0;
    transition:opacity .4s ease .05s,transform .5s cubic-bezier(.22,.85,.3,1) .05s;}
  .globe-transition.is-active .globe{opacity:1;transform:scale(1);}

  .globe-texture{position:absolute;inset:0;background-repeat:repeat-x;
    background-position:0 0;background-size:auto 100%;}

  /* sphere lighting: a bright limb top-left, a soft shadow bottom-right,
     and an overall edge vignette so a flat scrolling strip reads as a
     lit 3D ball rather than a spinning ribbon. */
  .globe-shading{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:
      radial-gradient(circle at 30% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 44%),
      radial-gradient(circle at 70% 80%,rgba(2,8,18,.55),rgba(2,8,18,0) 55%),
      radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%);}
  .globe-rim{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);}

  .globe-pin{display:flex;flex-direction:column;align-items:center;gap:9px;
    opacity:0;transform:translateY(-16px) scale(.6);
    transition:opacity .35s ease,transform .45s cubic-bezier(.34,1.56,.64,1);}
  .globe-pin.is-dropped{opacity:1;transform:translateY(0) scale(1);}
  .globe-pin svg{display:block;width:30px;height:38px;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));}
  .globe-caption{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:3px;
    text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);}

  @media (max-width:480px){
    .globe-caption{font-size:10.5px;letter-spacing:2px;}
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="stage">

    <section class="frame frame-sky sky-bg" aria-label="Opening scene: blue sky">
      <div class="clouds" aria-hidden="true">
        <div class="cloud-wrap cloud-1" style="--depth:0.4;--dx:-160px;"><div class="cloud cloud--a"></div></div>
        <div class="cloud-wrap cloud-2" style="--depth:0.9;--dx:180px;"><div class="cloud cloud--b"></div></div>
        <div class="cloud-wrap cloud-3" style="--depth:0.6;--dx:-110px;"><div class="cloud cloud--c"></div></div>
        <div class="cloud-wrap cloud-4" style="--depth:1.1;--dx:150px;"><div class="cloud cloud--a"></div></div>
        <div class="cloud-wrap cloud-5" style="--depth:0.3;--dx:-90px;"><div class="cloud cloud--b"></div></div>
        <div class="cloud-wrap cloud-6" style="--depth:0.75;--dx:120px;"><div class="cloud cloud--c"></div></div>
      </div>

      <div class="hero-text">
        <p class="scroll-hint">scroll ↓</p>
        <h1 class="headline">Where we going?</h1>
        <p class="subtitle">Let's find out.</p>
      </div>
    </section>

    <section class="frame frame-map sky-bg" aria-label="Enter the atlas">
      <div class="gateway">
        <p class="kicker">Know where you're headed?</p>

        <form class="place-form" action="index.html" method="GET">
          <input type="text" name="place" class="place-input"
            placeholder="Enter a state, city, or town…" autocomplete="off"
            aria-label="Enter a state, city, or town">
          <button type="submit" class="place-submit">Search →</button>
        </form>
        <p class="hint">We'll drop you into the map — find it there.</p>

        <div class="or-divider" aria-hidden="true">or</div>

        <a class="cta-btn" id="seeMapBtn" href="index.html">See Map →</a>
      </div>
    </section>

  </div>
</div>

<footer class="site-footer">
  Pinpoint — a hand-drawn map of the United States.
  <a href="index.html">Skip straight to the map →</a>
</footer>

<div class="globe-transition" id="globeTransition" aria-hidden="true">
  <div class="globe-stage">
    <div class="globe" id="globeEl">
      <div class="globe-texture" id="globeTexture"></div>
      <div class="globe-shading"></div>
      <div class="globe-rim"></div>
    </div>
    <div class="globe-pin" id="globePin">
      <svg viewBox="0 0 30 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 23 15 23s15-12.5 15-23c0-8.3-6.7-15-15-15z" fill="#D9A441"/>
        <circle cx="15" cy="15" r="6" fill="#1a1206"/>
      </svg>
      <p class="globe-caption">United States</p>
    </div>
  </div>
</div>

<script>
(function(){
  var prefersReduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReduced) return; // keep the static, fully-visible fallback layout

  document.documentElement.classList.add('js-cinematic');

  function remap(v, a, b){
    if (b === a) return v >= b ? 1 : 0;
    var t = (v - a) / (b - a);
    return Math.min(1, Math.max(0, t));
  }

  var wrapper = document.querySelector('.wrapper');
  var root = document.documentElement.style;
  var ticking = false;

  function update(){
    var rect = wrapper.getBoundingClientRect();
    var total = wrapper.offsetHeight - window.innerHeight;
    var scrolled = Math.min(Math.max(-rect.top, 0), Math.max(total, 1));
    var p = total > 0 ? scrolled / total : 0;

    root.setProperty('--pHint', remap(p, 0, 0.06));
    root.setProperty('--pHeadline', remap(p, 0.12, 0.30));
    root.setProperty('--pClouds', remap(p, 0.18, 0.55));

    var subEnter = remap(p, 0.30, 0.42);
    var subExit = remap(p, 0.50, 0.63);
    root.setProperty('--pSub', Math.max(0, subEnter - subExit));

    root.setProperty('--pGateway', remap(p, 0.55, 0.85));
    root.setProperty('--pCta', remap(p, 0.82, 1.0));
  }

  function onScroll(){
    if (!ticking){
      requestAnimationFrame(function(){ update(); ticking = false; });
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  update();

  // =====================================================================
  // "See Map" globe-spin transition.
  //
  // The globe is a circular, clipped viewport onto a wide, horizontally
  // *tileable* world-strip SVG (background-repeat:repeat-x). Spinning it
  // is just animating that strip's background-position-x — no 3D engine
  // needed; the radial-gradient "shading" layer in CSS (highlight +
  // limb-darkening) is what sells the illusion of a lit sphere.
  //
  // The strip is built so the United States landmass sits at a known
  // natural-coordinate offset (USA_CENTER_X below). We always spin an
  // exact number of full periods *plus* whatever extra distance lands
  // that offset dead-center in the viewport, so the globe reliably comes
  // to rest with the US centered no matter the viewport width.
  // =====================================================================

  var NATURAL_W = 1200;          // svg viewBox width  (one full "rotation")
  var NATURAL_H = 300;           // svg viewBox height (maps to globe diameter)
  var USA_CENTER_X = 1015;       // natural-coord x of the US landmass center

  var worldStripSvg =
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " + NATURAL_W + " " + NATURAL_H + "'>" +
      "<rect width='" + NATURAL_W + "' height='" + NATURAL_H + "' fill='#0E3A63'/>" +
      "<rect width='" + NATURAL_W + "' height='" + NATURAL_H + "' fill='#1E6FD9' opacity='0.35'/>" +
      // faint latitude lines for a hint of globe-grid structure
      "<g stroke='#ffffff' stroke-opacity='0.12' stroke-width='2' fill='none'>" +
        "<line x1='0' y1='75' x2='" + NATURAL_W + "' y2='75'/>" +
        "<line x1='0' y1='150' x2='" + NATURAL_W + "' y2='150'/>" +
        "<line x1='0' y1='225' x2='" + NATURAL_W + "' y2='225'/>" +
      "</g>" +
      // landmass A (~x 90-300) — a generic far-side continent
      "<g fill='#7fbf7f'>" +
        "<ellipse cx='150' cy='155' rx='70' ry='52'/>" +
        "<ellipse cx='215' cy='125' rx='52' ry='42'/>" +
        "<ellipse cx='255' cy='175' rx='46' ry='36'/>" +
        "<ellipse cx='110' cy='190' rx='38' ry='30'/>" +
      "</g>" +
      // landmass B (~x 480-760) — a second generic far-side continent
      "<g fill='#6fae8f'>" +
        "<ellipse cx='560' cy='118' rx='78' ry='58'/>" +
        "<ellipse cx='650' cy='162' rx='68' ry='52'/>" +
        "<ellipse cx='718' cy='108' rx='48' ry='40'/>" +
        "<ellipse cx='600' cy='205' rx='44' ry='34'/>" +
      "</g>" +
      // North America / United States landmass (~x 900-1150) — the one
      // we always land on; warm/gold so it reads as "the destination".
      "<g fill='#f0cf7e'>" +
        "<ellipse cx='955' cy='112' rx='72' ry='52'/>" +
        "<ellipse cx='1040' cy='150' rx='82' ry='58'/>" +
        "<ellipse cx='995' cy='192' rx='58' ry='40'/>" +
        "<ellipse cx='1088' cy='118' rx='42' ry='34'/>" +
      "</g>" +
      "<circle cx='" + USA_CENTER_X + "' cy='150' r='5' fill='#D9A441' stroke='#fff' stroke-width='1.5'/>" +
    "</svg>";

  var globeTexture = document.getElementById('globeTexture');
  if (globeTexture){
    globeTexture.style.backgroundImage =
      "url(\"data:image/svg+xml," + encodeURIComponent(worldStripSvg) + "\")";
  }

  var seeMapBtn = document.getElementById('seeMapBtn');
  var globeTransition = document.getElementById('globeTransition');
  var globeEl = document.getElementById('globeEl');
  var globePin = document.getElementById('globePin');

  if (seeMapBtn && globeTransition && globeEl && globePin){
    seeMapBtn.addEventListener('click', function(e){
      e.preventDefault();
      playGlobeSpin(seeMapBtn.href);
    });
  }

  function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }

  function playGlobeSpin(destUrl){
    var FADE_IN_MS = 350;     // overlay + globe appear
    var SPIN_MS = 1600;       // the spin itself (two full turns + landing)
    var PIN_HOLD_MS = 450;    // pin drops in, caption holds
    var LEAVE_MS = 300;       // zoom-into-globe exit, then navigate
    var navigated = false;

    function go(){
      if (navigated) return;
      navigated = true;
      window.location.href = destUrl;
    }
    // Safety net: never strand a visitor on the transition screen if a
    // timer gets throttled (e.g. backgrounded tab) or anything else goes
    // wrong — guarantee arrival at the map.
    var safety = setTimeout(go, FADE_IN_MS + SPIN_MS + PIN_HOLD_MS + LEAVE_MS + 1500);

    globeTransition.classList.add('is-active');

    setTimeout(function(){
      // offsetHeight (not getBoundingClientRect) deliberately: the globe
      // is still mid-way through its entrance scale(.8)->scale(1) CSS
      // transition at this point, and getBoundingClientRect reports the
      // transformed (shrunk) box, which would throw off the landing math.
      // offsetHeight reflects the untransformed layout size instead.
      var scale = globeEl.offsetHeight / NATURAL_H; // natural texture units -> rendered px
      // Two full rotations, then continue just far enough that the US
      // landmass's natural x-coordinate lands in the center of the
      // viewport. The globe is square (width === height), so with
      // background-size:auto 100% the visible window is NATURAL_H wide
      // in natural coordinates regardless of actual rendered size —
      // at offset O the window shows [O, O + NATURAL_H], centered at
      // O + NATURAL_H/2.
      var targetWithinPeriod = ((USA_CENTER_X - NATURAL_H / 2) % NATURAL_W + NATURAL_W) % NATURAL_W;
      var totalNaturalOffset = NATURAL_W * 2 + targetWithinPeriod;
      var start = null;

      function frame(ts){
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / SPIN_MS);
        var eased = easeOutQuint(t);
        var offsetPx = -(eased * totalNaturalOffset * scale);
        globeTexture.style.backgroundPositionX = offsetPx + 'px';
        if (t < 1){
          requestAnimationFrame(frame);
        } else {
          globePin.classList.add('is-dropped');
          setTimeout(function(){
            globeTransition.classList.add('is-leaving');
            setTimeout(function(){ clearTimeout(safety); go(); }, LEAVE_MS);
          }, PIN_HOLD_MS);
        }
      }
      requestAnimationFrame(frame);
    }, FADE_IN_MS);
  }
})();
</script>

</body>
</html>
