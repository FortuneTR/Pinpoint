<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pinpoint — An Interactive Atlas of the United States</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0B1013; --ink2:#131C22; --line:#24333C;
    --brass:#D9A441; --brass-d:#A87A28; --teal:#4FB0A5;
    --city:#6FA8DC; --city-d:#3E6D96;
    --parch:#ECE6D8; --mute:#8A9BA5;
    --panel-w:390px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--parch);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #map{position:absolute;inset:0;background:#060a0d;z-index:1;}

  /* cinematic vignette — depth around the edges (wave-atlas mood) */
  .vignette{position:absolute;inset:0;z-index:400;pointer-events:none;
    background:radial-gradient(120% 90% at 40% 45%,transparent 55%,rgba(3,6,9,.55) 100%);}

  /* ---- wordmark ---------------------------------------------------- */
  /* A translucent badge (like the basemap toggle) keeps it legible over any
     imagery; three zoom-tied variants (full/mid/compact) keep it from
     dominating the screen once you've zoomed into a state or a site. */
  .brand{position:absolute;top:18px;left:20px;z-index:1000;pointer-events:none;
    background:rgba(11,16,19,.72);border:1px solid var(--line);border-radius:10px;
    padding:10px 16px;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);
    transition:padding .25s ease;}
  .brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:30px;letter-spacing:.5px;
    margin:0;line-height:1;color:var(--parch);text-shadow:0 2px 16px rgba(0,0,0,.85);
    transition:font-size .25s ease;}
  .brand h1 span{color:var(--brass);}
  .brand p{margin:5px 0 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--mute);text-shadow:0 1px 10px rgba(0,0,0,.95);
    max-height:20px;opacity:1;overflow:hidden;
    transition:max-height .25s ease,opacity .2s ease,margin .25s ease;}
  .brand.zoom-mid h1{font-size:23px;}
  .brand.zoom-mid p{max-height:0;opacity:0;margin-top:0;}
  .brand.zoom-near{padding:7px 12px;}
  .brand.zoom-near h1{font-size:17px;}
  .brand.zoom-near p{max-height:0;opacity:0;margin-top:0;}

  /* ---- basemap toggle --------------------------------------------- */
  .basemap{position:absolute;bottom:22px;left:20px;z-index:1000;display:flex;
    background:rgba(11,16,19,.82);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .basemap button{background:none;border:none;color:var(--mute);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.2px;
    text-transform:uppercase;padding:9px 14px;transition:color .15s,background .15s;}
  .basemap button.on{color:#1a1206;background:var(--brass);}
  .basemap button:not(.on):hover{color:var(--parch);}

  /* ---- dossier / home panel --------------------------------------- */
  .panel{position:absolute;top:0;right:0;height:100%;width:var(--panel-w);z-index:1000;
    background:linear-gradient(180deg,rgba(11,16,19,.94),rgba(11,16,19,.985));
    border-left:1px solid var(--line);backdrop-filter:blur(10px);
    display:flex;flex-direction:column;box-shadow:-18px 0 46px rgba(0,0,0,.5);
    transform:translateX(105%);transition:transform .38s cubic-bezier(.4,0,.2,1);
    will-change:transform;}
  .panel.open{transform:translateX(0);}

  /* ---- search FAB: the only thing visible before you pick a state/city */
  .search-fab{position:absolute;top:18px;right:20px;z-index:1001;width:44px;height:44px;
    border-radius:50%;background:rgba(11,16,19,.82);border:1px solid var(--line);
    color:var(--parch);display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);transition:border-color .15s,transform .05s;}
  .search-fab:hover{border-color:var(--brass-d);}
  .search-fab:active{transform:scale(.95);}

  /* ---- persistent top-level search: always visible, no need to open the
     sidebar first to find a state, city, or town ---------------------- */
  .map-search{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    z-index:1000;width:360px;max-width:calc(100vw - 200px);}
  .map-search-ico{position:absolute;left:14px;top:13px;color:var(--mute);pointer-events:none;}
  .map-search input{width:100%;background:rgba(11,16,19,.82);border:1px solid var(--line);
    border-radius:10px;color:var(--parch);font-family:'Inter',sans-serif;font-size:14px;
    padding:11px 14px 11px 38px;outline:none;backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(0,0,0,.4);transition:border-color .15s;}
  .map-search input:focus{border-color:var(--brass-d);}
  .map-search input::placeholder{color:#5f7079;}
  .map-search-results{margin-top:6px;background:rgba(11,16,19,.94);border:1px solid var(--line);
    border-radius:10px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5);
    max-height:340px;overflow-y:auto;display:none;padding:6px;}
  .map-search-results.open{display:block;}
  .map-search-results .empty{padding:14px 12px;font-size:12.5px;}
  .panel-head{padding:22px 22px 16px;border-bottom:1px solid var(--line);}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--brass);margin-bottom:9px;display:block;}
  .panel-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:27px;margin:0;line-height:1.06;}
  .panel-head p{margin:12px 0 0;font-size:13.5px;line-height:1.6;color:var(--mute);}
  .abbr{font-family:'IBM Plex Mono',monospace;color:var(--mute);font-size:13px;margin-left:8px;}

  #panel-content{display:flex;flex-direction:column;height:100%;min-height:0;}
  .scroll{overflow-y:auto;flex:1;min-height:0;}
  .scroll::-webkit-scrollbar{width:8px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---- search ------------------------------------------------------ */
  .search-wrap{padding:16px 22px 8px;position:relative;}
  .search-wrap input{width:100%;background:var(--ink2);border:1px solid var(--line);
    border-radius:9px;color:var(--parch);font-family:'Inter',sans-serif;font-size:14px;
    padding:12px 14px 12px 38px;outline:none;transition:border-color .15s;}
  .search-wrap input:focus{border-color:var(--brass-d);}
  .search-wrap input::placeholder{color:#5f7079;}
  .search-ico{position:absolute;left:34px;top:29px;color:var(--mute);pointer-events:none;}
  .results{margin:8px 14px 0;}
  .result{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
    cursor:pointer;transition:background .12s;}
  .result:hover{background:var(--ink2);}
  .result .tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:1px;
    text-transform:uppercase;padding:2px 6px;border-radius:4px;flex:none;}
  .tag.state{color:var(--brass);border:1px solid var(--brass-d);}
  .tag.site{color:var(--teal);border:1px solid #2f6b64;}
  .tag.city{color:var(--city);border:1px solid var(--city-d);}
  .result .rname{font-size:13.5px;}
  .result .rsub{font-size:11px;color:var(--mute);}

  /* ---- discovery modes -------------------------------------------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 22px 6px;}
  .mode{display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;
    background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:15px;
    cursor:pointer;color:var(--parch);transition:border-color .15s,transform .05s;}
  .mode:hover{border-color:var(--brass-d);}
  .mode:active{transform:scale(.985);}
  .mode svg{color:var(--brass);}
  .mode .mt{font-size:14px;font-weight:600;}
  .mode .ms{font-size:11px;color:var(--mute);line-height:1.35;}

  /* ---- editorial picks -------------------------------------------- */
  .section-h{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;
    text-transform:uppercase;color:var(--mute);padding:18px 22px 8px;}
  .pick{display:flex;align-items:center;gap:12px;margin:0 14px 8px;padding:11px 14px;
    border:1px solid var(--line);border-radius:9px;background:var(--ink2);cursor:pointer;
    transition:border-color .15s,transform .05s;}
  .pick:hover{border-color:var(--teal);}
  .pick:active{transform:scale(.99);}
  .pick .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;
    box-shadow:0 0 0 3px rgba(79,176,165,.18);}
  .pick .pname{font-size:13.5px;font-weight:500;}
  .pick .ploc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute);margin-top:2px;}

  /* ---- state dossier ---------------------------------------------- */
  .readout{padding:16px 22px;border-bottom:1px solid var(--line);}
  .row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;align-items:baseline;}
  .row .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-top:2px;}
  .row .v{font-size:13.5px;text-align:right;line-height:1.4;}
  .row .v.date{font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:14px;
    letter-spacing:.5px;font-weight:500;}

  .sites-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 10px;}
  .sites-head h3{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--mute);margin:0;font-weight:500;}
  .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);
    border:1px solid var(--brass-d);border-radius:20px;padding:1px 9px;}

  .site{margin:0 14px 8px;border:1px solid var(--line);border-radius:9px;background:var(--ink2);
    cursor:pointer;transition:border-color .15s,transform .05s;overflow:hidden;}
  .site:hover{border-color:var(--brass-d);}
  .site:active{transform:scale(.995);}
  .site.active{border-color:var(--brass);background:#182129;}
  .site-top{display:flex;align-items:center;gap:11px;padding:12px 14px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;
    box-shadow:0 0 0 3px rgba(79,176,165,.18);}
  .dot.city{background:var(--city);box-shadow:0 0 0 3px rgba(111,168,220,.2);}
  .site-name{font-size:14px;font-weight:500;line-height:1.25;}
  .site-est{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute);
    margin-top:2px;letter-spacing:.5px;}
  .site-body{max-height:0;opacity:0;transition:max-height .3s ease,opacity .2s;padding:0 14px;}
  .site.open .site-body{max-height:430px;opacity:1;padding:0 14px 14px 34px;}
  .site-body p{margin:0 0 8px;font-size:12.5px;line-height:1.55;color:#cdd6da;}
  .site-body p:last-child{margin-bottom:0;}

  /* ---- photo gallery: scrollable image strip atop the description --- */
  .gallery{position:relative;margin:2px 0 10px;border-radius:8px;overflow:hidden;
    background:#060a0d;border:1px solid var(--line);}
  .gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x proximity;
    scrollbar-width:none;-ms-overflow-style:none;}
  .gallery-track::-webkit-scrollbar{display:none;}
  .gallery-slide{flex:0 0 100%;scroll-snap-align:start;}
  .gallery-slide img{width:100%;height:150px;object-fit:cover;display:block;}
  .gallery-status{padding:16px 14px;font-size:11.5px;color:var(--mute);text-align:center;}
  .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;
    border-radius:50%;background:rgba(11,16,19,.72);border:1px solid rgba(236,230,216,.28);
    color:var(--parch);display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:12px;line-height:1;user-select:none;transition:background .15s;}
  .gallery-nav:hover{background:rgba(11,16,19,.92);}
  .gallery-nav.prev{left:6px;} .gallery-nav.next{right:6px;}
  .gallery-dots{display:flex;gap:5px;justify-content:center;padding:7px 0;background:#060a0d;}
  .gallery-dots span{width:5px;height:5px;border-radius:50%;background:rgba(236,230,216,.25);}
  .gallery-dots span.on{background:var(--brass);}

  .empty{padding:20px 22px;color:var(--mute);font-size:13px;line-height:1.6;}

  .back{margin:16px 22px 4px;display:inline-flex;align-items:center;gap:8px;background:none;
    border:1px solid var(--line);color:var(--parch);font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:1px;padding:8px 14px;border-radius:6px;cursor:pointer;
    text-transform:uppercase;transition:border-color .15s,color .15s;}
  .back:hover{border-color:var(--brass);color:var(--brass);}

  .seed-note{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;
    color:#566670;padding:16px 22px 20px;border-top:1px solid var(--line);line-height:1.6;}

  /* ---- map markers: needle pins ----------------------------------- */
  .pin{transition:transform .12s ease;transform-origin:50% 100%;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));cursor:pointer;}
  .pin svg{display:block;}
  .pin:hover{transform:translateY(-2px) scale(1.08);}

  /* ---- selected-state pushpin + its co-located name caption -------- */
  .state-pin-wrap{position:absolute;top:0;left:0;transform:translate(-50%,-100%);
    display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .state-pin-wrap svg{display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.6));}
  .state-pin-label{margin-bottom:5px;padding:4px 11px;border-radius:7px;
    background:rgba(11,16,19,.85);border:1px solid var(--line);color:var(--parch);
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;white-space:nowrap;
    backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.4);}

  /* ---- state/city names as clickable hyperlink-style text, in place of
     an invisible pin/oval hit area -------------------------------------- */
  .map-link{position:absolute;top:0;left:0;transform:translate(-50%,-50%);
    font-family:'Inter',sans-serif;font-weight:600;white-space:nowrap;
    cursor:pointer;user-select:none;text-decoration:underline;text-underline-offset:3px;
    text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.9);
    transition:color .15s,text-decoration-color .15s;}
  .map-link.state-link{font-size:14px;color:var(--brass);text-decoration-color:rgba(217,164,65,.55);}
  .map-link.state-link:hover{color:#f0c96b;text-decoration-color:#f0c96b;}
  .map-link.city-link{font-size:12.5px;color:var(--city);text-decoration-color:rgba(111,168,220,.55);}
  .map-link.city-link:hover{color:#a9cdec;text-decoration-color:#a9cdec;}

  .leaflet-popup-content-wrapper{background:var(--ink2);color:var(--parch);
    border:1px solid var(--brass-d);border-radius:10px;}
  .leaflet-popup-tip{background:var(--ink2);border:1px solid var(--brass-d);}
  .leaflet-popup-content{margin:14px 16px;font-family:'Inter',sans-serif;}
  .pop-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin-bottom:3px;}
  .pop-est{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);
    letter-spacing:1px;margin-bottom:8px;}
  .pop-body{font-size:12.5px;line-height:1.55;color:#cdd6da;max-width:268px;margin-top:8px;}
  .leaflet-popup-content .gallery{margin-top:8px;}
  .pop-tabs{display:flex;gap:4px;margin-top:8px;border-bottom:1px solid var(--line);}
  .pop-tab{background:none;border:none;color:var(--mute);font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;padding:6px 4px 8px;
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .pop-tab.active{color:var(--brass);border-bottom-color:var(--brass);}
  .pop-tab:hover:not(.active){color:var(--parch);}
  .pop-tabpanel[hidden]{display:none;}
  .travel-list{max-width:268px;margin-top:8px;}
  .travel-cat{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;
    color:var(--brass);text-transform:uppercase;margin:10px 0 4px;}
  .travel-cat:first-child{margin-top:0;}
  .travel-item{font-size:12.5px;line-height:1.5;color:#cdd6da;padding-left:2px;}
  .travel-status{font-size:11.5px;color:var(--mute);padding:10px 0;}
  .leaflet-container{background:#060a0d;}
  .leaflet-bar a{background:var(--ink2);color:var(--parch);border-color:var(--line);}
  .leaflet-bar a:hover{background:var(--line);}
  .leaflet-control-attribution{background:rgba(11,16,19,.7)!important;color:#6b7c85!important;}
  .leaflet-control-attribution a{color:#8a9ba5!important;}

  /* ---- zoom control: bottom-right, horizontal, "+" on the right ---- */
  /* DOM order is [zoom-in, zoom-out]; row-reverse flips the visual order so
     zoom-out (−) lands on the left and zoom-in (+) lands on the right. */
  .leaflet-control-zoom{display:flex!important;flex-direction:row-reverse;
    border:1px solid var(--line)!important;border-radius:8px!important;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .leaflet-control-zoom a{border-radius:0!important;width:34px!important;height:34px!important;
    line-height:34px!important;}
  .leaflet-control-zoom-in{border-left:1px solid var(--line);}
  .leaflet-bottom.leaflet-right{z-index:1001;margin-bottom:22px;margin-right:20px;}

  /* ---- responsive ------------------------------------------------- */
  @media (max-width:720px){
    :root{--panel-w:100%;}
    .panel{top:auto;bottom:0;height:56%;width:100%;border-left:none;border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;box-shadow:0 -18px 46px rgba(0,0,0,.55);
      transform:translateY(105%);}
    .panel.open{transform:translateY(0);}
    .brand h1{font-size:24px;} .brand{top:14px;left:16px;}
    .basemap{bottom:calc(56% + 14px);left:16px;}
    .search-fab{top:14px;right:16px;}
    .map-search{top:66px;left:16px;right:16px;transform:none;width:auto;max-width:none;}
  }
</style>
</head>
<body>
  <div id="map"></div>
  <div class="vignette"></div>

  <div class="brand">
    <h1>Pin<span>point</span></h1>
    <p>Atlas of the United States</p>
  </div>

  <div class="basemap">
    <button id="bm-sat" class="on">Satellite</button>
    <button id="bm-night">Night lights</button>
  </div>

  <button class="search-fab" id="search-fab" title="Open sidebar" aria-label="Open sidebar">
    <svg id="fab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
  </button>

  <div class="map-search" id="map-search">
    <span class="map-search-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    </span>
    <input id="map-search-input" type="text" placeholder="Search a state, city, or town…" autocomplete="off">
    <div id="map-search-results" class="map-search-results"></div>
  </div>

  <aside class="panel"><div id="panel-content"></div></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ==================================================================
   PINPOINT — seed dataset
   window.PINPOINT_STATES : one record per state (+ D.C.)
   Fields:
     name, abbr, lat, lng      display + map pin location (approx. center)
     admitted   "MM/DD/YYYY"   statehood date (ratification for the original 13)
     order                     admission order, or note for D.C.
     origin                    short name-origin summary
     sites[]    { name, est, lat, lng, fact }
   NOTE: Dates & origins are best-effort seed data. Verify against NPS /
   U.S. Census / state archives before treating as authoritative.
   ================================================================== */
window.PINPOINT_STATES = [
  { name:"Alabama", abbr:"AL", lat:32.8, lng:-86.8, admitted:"12/14/1819", order:"22nd state",
    origin:"From the Alabama (Alibamu) people; often glossed from Choctaw as \u201cthicket clearers.\u201d", sites:[], cities:[ { name:"Birmingham", lat:33.5207, lng:-86.8025, founded:"1871", origin:"Named for Birmingham, England, an ironworking center its founders hoped to rival.", fact:"Nicknamed the 'Magic City' for how fast it grew once local iron ore, coal, and limestone let it become the South's great steel town." }, { name:"Montgomery", lat:32.3668, lng:-86.3000, founded:"1819", origin:"Named for Gen. Richard Montgomery, a Revolutionary War general killed at the 1775 Battle of Quebec.", fact:"Montgomery served as the first capital of the Confederate States of America in February 1861, and eight decades later the 1955–56 Montgomery Bus Boycott began there." } ] },
  { name:"Alaska", abbr:"AK", lat:63.5, lng:-152.0, admitted:"01/03/1959", order:"49th state",

// it's restricted to this site's domain in the Mapbox account dashboard
// (Tokens → this token → URL restrictions). Public "pk." tokens are always
// visible in page source for any Mapbox web app; the restriction, not
// secrecy, is what makes that safe.
const MAPBOX_TOKEN = 'pk.eyJ1Ijoia2VucGFjaDEiLCJhIjoiY210eGRubnZtMDNrbzJ3b2s3bXJ5dXJtNyJ9.JWOm9iFIxzSvcjyH367U5A';

// ourselves — no text, just lines — and they work in both modes for free.

let nationalBorders = L.layerGroup().addTo(map);

let currentBase = 'sat';

  document.getElementById('bm-sat').classList.toggle('on', mode==='sat');
  document.getElementById('bm-night').classList.toggle('on', mode==='night');
}
document.getElementById('bm-sat').onclick   = ()=>setBase('sat');
document.getElementById('bm-night').onclick = ()=>setBase('night');

/* ---- real state boundaries: fetched once, cached, drawn on selection --- */
// Bundled locally (data/us-states.json) rather than fetched from a third-party
// host at runtime — that's more robust than depending on an external CDN's
// uptime/CORS policy, and avoids the cross-origin fetch failing silently.
// Source: US Census-derived state polygons (properties.name = full state name),
// via the widely-used PublicaMundi/MappingAPI GeoJSON sample set.
const STATE_GEOJSON_URL = 'data/us-states.json';
const GEOJSON_NAME_OVERRIDES = { 'Washington, D.C.':'District of Columbia' };
let STATE_GEOJSON = null;
let stateGeoJsonPromise = null;
function loadStateGeoJson(){
  if(!stateGeoJsonPromise){
    stateGeoJsonPromise = fetch(STATE_GEOJSON_URL).then(r=>{
      if(!r.ok) throw new Error('state boundary fetch failed: '+r.status);
      return r.json();
    }).then(data=>{ STATE_GEOJSON = data; return data; })
      .catch(err=>{ console.warn('Pinpoint: state boundaries unavailable, falling back to circles.', err); STATE_GEOJSON = false; return null; });
  }
  return stateGeoJsonPromise;
}

    .addTo(nationalBorders);

// governments (NYC, LA, Nashville, Indianapolis, etc.) aren't in the source
// data, so those fall back to the circle approximation, same as unmatched
// states. Matched by {state abbr, city name} since names alone can collide
// (there's a Portland in both Maine and Oregon).
const CITY_GEOJSON_URL = 'data/us-cities.json';
let CITY_GEOJSON = null;
let cityGeoJsonPromise = null;
function loadCityGeoJson(){
  if(!cityGeoJsonPromise){
    cityGeoJsonPromise = fetch(CITY_GEOJSON_URL).then(r=>{

}

// Google-Maps-inspired boundary treatment: a crisp dashed line with rounded
// joins/caps and a faint fill tint, rather than a solid stroke.
const BOUNDARY_STYLE = { weight:2.5, opacity:.95, dashArray:'6 4', lineJoin:'round', lineCap:'round' };
// True area-weighted centroid of a polygon ring (shoelace formula), not just
// a bounding-box midpoint — a bbox center gets dragged wherever a shape's
// extremities pull it (e.g. Florida's panhandle drags a bbox center out over
// the Gulf, off the peninsula entirely). For a Polygon/MultiPolygon feature,
// this picks the largest sub-polygon by area and centers on that — avoiding
// e.g. Hawaii's centroid landing in open ocean between separate islands.
function ringCentroid(ring){
  let cx=0, cy=0, a=0;
  for(let i=0;i<ring.length-1;i++){
    const [x0,y0]=ring[i], [x1,y1]=ring[i+1];
    const cross = x0*y1 - x1*y0;
    a += cross; cx += (x0+x1)*cross; cy += (y0+y1)*cross;
  }
  a *= 0.5;
  if(Math.abs(a) < 1e-10) return null;
  return { lng:cx/(6*a), lat:cy/(6*a), area:Math.abs(a) };
}
function largestRingCentroid(geometry){
  const polygons = geometry.type==='Polygon' ? [geometry.coordinates] : geometry.coordinates;
  let best = null;
  polygons.forEach(poly=>{
    const c = ringCentroid(poly[0]); // poly[0] = outer ring, ignore holes
    if(c && (!best || c.area>best.area)) best = c;
  });
  return best;
}
function drawStateOutline(st){
  stateOutline.clearLayers();
  const fallbackLatLng = [st.lat,st.lng];
  const drawFallbackCircle = ()=>{
    L.circle(fallbackLatLng,{
      ...BOUNDARY_STYLE, radius:180000, color:'#D9A441', fillColor:'#D9A441', fillOpacity:.06
    }).addTo(stateOutline);
    return fallbackLatLng;
  };
  if(STATE_GEOJSON===null){
    // still loading — draw the approximation now, upgrade to the real
    // polygon if it arrives while this state is still selected
    const latlng = drawFallbackCircle();
    loadStateGeoJson().then(()=>{ if(CURRENT_STATE===st) drawStateOutline(st); });
    return latlng;
  }
  const lookupName = GEOJSON_NAME_OVERRIDES[st.name] || st.name;
  const feature = STATE_GEOJSON && STATE_GEOJSON.features &&
    STATE_GEOJSON.features.find(f=>f.properties && f.properties.name===lookupName);
  if(feature){
    L.geoJSON(feature,{
      style:{ ...BOUNDARY_STYLE, color:'#D9A441', fillColor:'#D9A441', fillOpacity:.06 }
    }).addTo(stateOutline);
    const c = largestRingCentroid(feature.geometry);
    return c ? [c.lat,c.lng] : stateOutline.getBounds().getCenter();
  }else{
    return drawFallbackCircle();
  }
}

function exploreNearby(){
  const nearest = pos=>{
    const {latitude:la,longitude:lo}=pos.coords;
    let best=STATES[0],bd=Infinity;
    STATES.forEach(s=>{const d=(s.lat-la)**2+(s.lng-lo)**2; if(d<bd){bd=d;best=s;}});
    selectState(best);
  };
  if(!navigator.geolocation){ flashNearbyError(); return; }
  navigator.geolocation.getCurrentPosition(nearest, flashNearbyError, {timeout:8000});
}

  const m=panel.querySelector('#m-nearby');

// Restaurants/bars/parks/theaters go stale the moment a place closes or
// changes hands — rather than hand-write listings that would rot immediately,
// fetch real, current places from OpenStreetMap's free Overpass API, the same
// "live rather than fabricated" approach used for photos and boundaries.
const TRAVEL_CACHE = {};
const TRAVEL_CATEGORIES = [
  { label:'Restaurants',       match:t=>t.amenity==='restaurant' },
  { label:'Bars',              match:t=>t.amenity==='bar'||t.amenity==='pub' },
  { label:'Cafes & Hangouts',  match:t=>t.amenity==='cafe'||t.amenity==='nightclub' },
  { label:'Parks',             match:t=>t.leisure==='park' },
  { label:'Movie Theaters',    match:t=>t.amenity==='cinema' },
];
// The free public Overpass instances are shared, volunteer-run resources —
// any one of them can be slow, rate-limiting, or briefly down. Try a short
// list of independent mirrors in order rather than failing the whole feature
// the moment the first one has a bad moment.
const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.osm.ch/api/interpreter',
];
async function loadTravelData(container, c){
  const key = `${c.lat},${c.lng}`;
  if(TRAVEL_CACHE[key]){ renderTravelList(container, TRAVEL_CACHE[key]); return; }
  container.innerHTML = `<div class="travel-status">Finding nearby places…</div>`;
  const query = `[out:json][timeout:25];(
    node["amenity"="restaurant"](around:4000,${c.lat},${c.lng});
    node["amenity"="bar"](around:4000,${c.lat},${c.lng});
    node["amenity"="pub"](around:4000,${c.lat},${c.lng});
    node["amenity"="cafe"](around:4000,${c.lat},${c.lng});
    node["amenity"="nightclub"](around:4000,${c.lat},${c.lng});
    node["amenity"="cinema"](around:4000,${c.lat},${c.lng});
    node["leisure"="park"](around:4000,${c.lat},${c.lng});
  );out body 80;`;
  let lastErr = null;
  for(const endpoint of OVERPASS_ENDPOINTS){
    try{
      const res = await fetch(endpoint, {
        method:'POST',
        headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
        body:'data='+encodeURIComponent(query)
      });
      if(!res.ok) throw new Error('overpass fetch failed: '+res.status+' from '+endpoint);
      const data = await res.json();
      const named = (data.elements||[]).filter(el=>el.tags && el.tags.name);
      TRAVEL_CACHE[key] = named;
      renderTravelList(container, named);
      return;
    }catch(e){
      lastErr = e;
    }
  }
  console.warn('Pinpoint: travel listings unavailable.', lastErr);
  TRAVEL_CACHE[key] = [];
  container.innerHTML = `<div class="travel-status">Couldn’t load nearby places right now.</div>`;
}
function renderTravelList(container, elements){
  const groups = TRAVEL_CATEGORIES
    .map(cat=>({ label:cat.label, items:elements.filter(el=>cat.match(el.tags)).slice(0,6) }))
    .filter(g=>g.items.length);
  if(!groups.length){
    container.innerHTML = `<div class="travel-status">No nearby listings found yet.</div>`;
    return;
  }
  container.innerHTML = groups.map(g=>`
    <div class="travel-cat">${esc(g.label)}</div>
    ${g.items.map(it=>`<div class="travel-item">${esc(it.tags.name)}</div>`).join('')}
  `).join('');
}
// Wikipedia's media-list mixes real photos of the subject in with maps, seals,
// locator diagrams, and flag icons pulled from infoboxes — filter those out so
// the majority of what's shown is actually a picture of the site itself.
const NON_PHOTO_EXT = /\.(svg|gif|ogv|webm|ogg)$/i;
const NON_PHOTO_NAME = /\b(locator|map|flag|seal|logo|coat of arms|coa|diagram|chart|emblem|symbol|icon|screenshot|banner|wordmark|signature)\b/i;
const looksLikePhoto = fname => {
  const clean = (fname||'').replace(/_/g,' ');
  return !NON_PHOTO_EXT.test(clean) && !NON_PHOTO_NAME.test(clean);
};
async function loadGalleryImages(container, title, altFallback){
  if(IMAGE_CACHE[title]){ renderGallery(container, IMAGE_CACHE[title]); return; }
  container.innerHTML = `<div class="gallery-status">Loading photos…</div>`;
  try{
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(title)}`);
    if(!res.ok) throw new Error('no media-list for '+title);
    const data = await res.json();
    const images = (data.items||[])
      .filter(it=>it.type==='image' && Array.isArray(it.srcset) && it.srcset.length && looksLikePhoto(it.title))
      .slice(0,8)
      .map(it=>{
        const variant = it.srcset[Math.min(1,it.srcset.length-1)];
        let src = variant.src; if(src.startsWith('//')) src = 'https:'+src;
        const alt = (it.title||altFallback).replace(/^File:/,'').replace(/\.[a-zA-Z0-9]+$/,'');
        return { src, alt };
      });
    IMAGE_CACHE[title] = images;
    renderGallery(container, images);
  }catch(e){
    IMAGE_CACHE[title] = [];
    renderGallery(container, []);
  }
}
function renderGallery(container, images){
  if(!images.length){
    container.innerHTML = `<div class="gallery-status">No photos available yet.</div>`;
    return;
  }
  container.innerHTML = `
    <div class="gallery-track">${images.map(im=>
      `<div class="gallery-slide"><img src="${im.src}" alt="${esc(im.alt)}" loading="lazy"
        onerror="this.closest('.gallery-slide').remove()"></div>`).join('')}</div>
    ${images.length>1 ? `
      <button class="gallery-nav prev" aria-label="Previous photo">‹</button>
      <button class="gallery-nav next" aria-label="Next photo">›</button>
      <div class="gallery-dots">${images.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join('')}</div>` : ''}`;
  const track = container.querySelector('.gallery-track');
  const dots  = container.querySelectorAll('.gallery-dots span');
  const prev  = container.querySelector('.gallery-nav.prev');
  const next  = container.querySelector('.gallery-nav.next');
  const go = delta => track.scrollBy({ left: track.clientWidth*delta, behavior:'smooth' });
  if(prev) prev.onclick = ()=>go(-1);
  if(next) next.onclick = ()=>go(1);
  track.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.preventDefault(); track.scrollLeft += e.deltaY; }
  }, { passive:false });
  let dotsRaf = null;
  track.addEventListener('scroll', ()=>{
    if(dotsRaf) return;
    dotsRaf = requestAnimationFrame(()=>{
      dotsRaf = null;
      const idx = Math.round(track.scrollLeft/track.clientWidth);
      dots.forEach((d,i)=>d.classList.toggle('on', i===idx));
    });
  }, { passive:true });
}

/* ---- selection flow -------------------------------------------- */
function selectState(st, focusIndex, cityFocusIndex){
  // (no longer forces satellite mode here — that used to silently discard
  // night mode the instant you selected a state, which also made it look
  // like the outline "didn't appear" in dark mode: the map had already
  // flipped back to satellite by the time you saw it.)
  CURRENT_STATE = st;
  siteLayer.clearLayers(); siteMarkers={};
  cityLayer.clearLayers(); cityMarkers={}; cityHighlight.clearLayers();
  statePinLayer.clearLayers();
  // Anchor the pin to the real polygon's area-weighted centroid when we have
  // one, instead of the seed data's hand-picked lat/lng or a bbox midpoint
  // (which a shape like Florida's panhandle would drag out over the Gulf).
  const pinLatLng = drawStateOutline(st);
  L.marker(pinLatLng,{icon:statePinIconFn(st.name),title:st.name}).addTo(statePinLayer);
  renderState(st);
  showPanel();
  const sites = st.sites||[];
  const cities = st.cities||[];
  const pts=[];
  sites.forEach((s,i)=>{
    const m=L.marker([s.lat,s.lng],{icon:SITE_ICON}).addTo(siteLayer)
      .bindPopup(`<div class="pop-name">${esc(s.name)}</div>
                  <div class="pop-est">${esc(s.est)}</div>
                  <div class="gallery" data-loaded="0"></div>
                  <div class="pop-body">${esc(s.fact)}</div>`,{maxWidth:300,minWidth:260});
    m.on('click',()=>highlightListItem(i));
    m.on('popupopen',()=>ensureGalleryPopup(m,s));
    siteMarkers[i]=m; pts.push([s.lat,s.lng]);
  });
  cities.forEach((c,i)=>{
    const m=L.marker([c.lat,c.lng],{icon:cityLinkIcon(c.name)}).addTo(cityLayer)
      .bindPopup(`<div class="pop-name">${esc(c.name)}</div>
                  <div class="pop-est">Founded ${esc(c.founded)}</div>
                  <div class="pop-tabs">
                    <button class="pop-tab active" data-tab="facts">Facts</button>
                    <button class="pop-tab" data-tab="travel">Travel</button>
                  </div>
                  <div class="pop-tabpanel" data-panel="facts">
                    <div class="pop-body">${esc(c.fact)}</div>
                  </div>
                  <div class="pop-tabpanel" data-panel="travel" hidden>
                    <div class="travel-list" data-loaded="0"></div>
                  </div>`,{maxWidth:280,minWidth:250});
    m.on('click',()=>highlightCityFromMap(st,i));
    m.on('popupopen',()=>wireCityPopupTabs(m,c));
    cityMarkers[i]=m; pts.push([c.lat,c.lng]);
  });
  if(focusIndex!=null && sites[focusIndex]){
    const s=sites[focusIndex];
    map.flyTo([s.lat,s.lng],13,{duration:1.15});
    setTimeout(()=>{ siteMarkers[focusIndex].openPopup(); openListItem(focusIndex); },700);
  }else if(cityFocusIndex!=null && cities[cityFocusIndex]){
    setTimeout(()=> selectCityFromList(st,cityFocusIndex,
      panel.querySelector(`.site[data-kind="city"][data-i="${cityFocusIndex}"]`)),700);
  }else{
    // General state view: frame the state's own outline, not just its (often
    // sparse) site/city points — otherwise a state with one city zooms in so
    // tight the boundary we just drew never actually appears on screen.
    const hasOutline = stateOutline.getLayers().length>0;
    const bounds = hasOutline ? stateOutline.getBounds() : (pts.length ? L.latLngBounds(pts) : null);
    if(hasOutline) pts.forEach(p=>bounds.extend(p));
    if(bounds){
      map.flyToBounds(bounds.pad(hasOutline?0.08:0.4),
        {maxZoom:11,duration:1.1,paddingTopLeft:[0,60],paddingBottomRight:[panelPad(),0]});
    }else{
      map.flyTo([st.lat,st.lng],6,{duration:1.1});
    }
  }
}
function selectSite(st,i,el){
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  cityHighlight.clearLayers();
  const m=siteMarkers[i];
  if(m){ map.flyTo([st.sites[i].lat,st.sites[i].lng],13,{duration:1}); m.openPopup(); }
}
function openListItem(i){
  const el=panel.querySelector(`.site[data-kind="site"][data-i="${i}"]`); if(!el) return;
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('active'));
  el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'center'});
}
function highlightListItem(i){ cityHighlight.clearLayers(); openListItem(i); }

/* ---- city selection: outline + list sync ------------------------ */
function drawCityOutline(c, st){
  cityHighlight.clearLayers();
  const drawFallbackCircle = ()=> L.circle([c.lat,c.lng],{
    ...BOUNDARY_STYLE, radius:c.radius||9000, color:'#6FA8DC', fillColor:'#6FA8DC', fillOpacity:.1
  }).addTo(cityHighlight);
  if(CITY_GEOJSON===null){
    // still loading — approximate now, upgrade to the real shape if it
    // arrives while this same state is still selected
    drawFallbackCircle();
    loadCityGeoJson().then(()=>{ if(CURRENT_STATE===st) drawCityOutline(c, st); });
    return;
  }
  const feature = CITY_GEOJSON && CITY_GEOJSON.features &&
    CITY_GEOJSON.features.find(f=>f.properties && f.properties.state===st.abbr && f.properties.name===c.name);
  if(feature){
    L.geoJSON(feature,{ style:{ ...BOUNDARY_STYLE, color:'#6FA8DC', fillColor:'#6FA8DC', fillOpacity:.1 } }).addTo(cityHighlight);
  }else{
    drawFallbackCircle();
  }
}
function openCityListItem(i){
  const el=panel.querySelector(`.site[data-kind="city"][data-i="${i}"]`); if(!el) return;
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'center'});
}
function selectCityFromList(st,i,el){
  const c = st.cities[i];
  const opened = el && el.classList.contains('open');
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  if(el && !opened) el.classList.add('open');
  else if(!el) openCityListItem(i);
  drawCityOutline(c, st);
  // Plain flyTo centers on the full map div, including the width hidden
  // behind the sidebar panel — the point ends up off-center in what's
  // actually visible. flyToBounds with the same panel padding used
  // elsewhere shifts the true visual center into the unobscured area.
  map.flyToBounds(L.latLngBounds([c.lat,c.lng],[c.lat,c.lng]),
    {maxZoom:12,duration:1,paddingTopLeft:[0,60],paddingBottomRight:[panelPad(),0]});
  const m=cityMarkers[i]; if(m) m.openPopup();
}
function highlightCityFromMap(st,i){
  drawCityOutline(st.cities[i], st);
  openCityListItem(i);
}
function resetToUSA(){
  CURRENT_STATE = null;
  siteLayer.clearLayers(); siteMarkers={};
  cityLayer.clearLayers(); cityMarkers={}; cityHighlight.clearLayers();
  statePinLayer.clearLayers(); stateOutline.clearLayers();
  map.flyTo(USA_VIEW.center,USA_VIEW.zoom,{duration:1.1});
  renderHome();
  hidePanel();
}

/* ---- boot ------------------------------------------------------ */
// The small Northeast states sit close enough together at the national
// view that their text labels collide; nudge them apart (screen pixels).
const LABEL_NUDGE = {
  VT:[-16,-20], NH:[18,-14], MA:[26,-2], RI:[34,16], CT:[2,20],
  NJ:[24,20], DE:[34,12], MD:[-4,32], DC:[36,60], WV:[-42,-18], VA:[8,-16],
  OH:[-6,-22], IL:[-14,-6], IN:[10,10], MS:[-26,-6], AL:[22,14]
};
STATES.forEach(st=>{
  const [dx,dy] = LABEL_NUDGE[st.abbr] || [0,0];
  L.marker([st.lat,st.lng],{icon:stateLinkIcon(st.name,dx,dy),title:st.name})
    .addTo(stateLayer).on('click',()=>selectState(st));
});
renderHome();
fab.onclick = ()=>{
  if(panelEl.classList.contains('open')) hidePanel();
  else { if(!CURRENT_STATE) renderHome(); showPanel(); }
};

/* ---- persistent top-level search: states, cities, towns, sites --- */
(function(){
  const input = document.getElementById('map-search-input');
  const results = document.getElementById('map-search-results');
  function renderResults(v){
    const hits = SEARCH_INDEX.filter(x=>x.label.toLowerCase().includes(v)).slice(0,8);
    results.innerHTML = hits.length ? hits.map(h=>`
      <div class="result" data-type="${h.type}" data-a="${h.abbr}" ${h.i!=null?`data-i="${h.i}"`:''}>
        <span class="tag ${h.type}">${h.type}</span>
        <div><div class="rname">${esc(h.label)}</div><div class="rsub">${esc(h.sub)}</div></div>
      </div>`).join('') : `<div class="empty">No matches for “${esc(input.value)}”.</div>`;
    results.classList.add('open');
    results.querySelectorAll('.result').forEach(el=>{
      el.onclick = ()=>{
        const st = byAbbr(el.dataset.a);
        if(el.dataset.type==='site') selectState(st, +el.dataset.i);
        else if(el.dataset.type==='city') selectState(st, null, +el.dataset.i);
        else selectState(st);
        results.classList.remove('open');
      };
    });
  }
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    if(!v){ results.classList.remove('open'); results.innerHTML=''; return; }
    renderResults(v);
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Escape'){ input.value=''; results.classList.remove('open'); input.blur(); } });
  input.addEventListener('focus', ()=>{ if(input.value.trim()) results.classList.add('open'); });
  document.addEventListener('click', e=>{
    if(!e.target.closest('.map-search')) results.classList.remove('open');
  });
})();
</script>
