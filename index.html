<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinpoint — An Interactive Atlas of the United States</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ---- token system -------------------------------------------------
     ink      #0E1418  panel base
     ink2     #131C22  raised panel
     line     #24333C  hairline borders
     brass    #D9A441  primary accent (surveyor amber)
     brass-d  #A87A28  pressed / borders
     teal     #4FB0A5  secondary (site markers)
     parch    #ECE6D8  primary text
     mute     #8A9BA5  secondary text
     ------------------------------------------------------------------ */
  :root{
    --ink:#0E1418; --ink2:#131C22; --line:#24333C;
    --brass:#D9A441; --brass-d:#A87A28; --teal:#4FB0A5;
    --parch:#ECE6D8; --mute:#8A9BA5;
    --panel-w:380px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--parch);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  #map{position:absolute;inset:0;background:#0a0f12;z-index:1;}

  /* ---- wordmark ---------------------------------------------------- */
  .brand{position:absolute;top:18px;left:20px;z-index:1000;pointer-events:none;}
  .brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:30px;
    letter-spacing:.5px;margin:0;line-height:1;color:var(--parch);
    text-shadow:0 2px 12px rgba(0,0,0,.7);}
  .brand h1 span{color:var(--brass);}
  .brand p{margin:4px 0 0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:2.5px;text-transform:uppercase;color:var(--mute);
    text-shadow:0 1px 8px rgba(0,0,0,.9);}

  /* ---- dossier panel ---------------------------------------------- */
  .panel{position:absolute;top:0;right:0;height:100%;width:var(--panel-w);z-index:1000;
    background:linear-gradient(180deg,rgba(14,20,24,.97),rgba(14,20,24,.99));
    border-left:1px solid var(--line);backdrop-filter:blur(6px);
    display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.45);}
  .panel-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--brass);margin-bottom:8px;display:block;}
  .panel-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:26px;
    margin:0;line-height:1.05;}
  .abbr{font-family:'IBM Plex Mono',monospace;color:var(--mute);font-size:13px;
    margin-left:8px;}

  /* readout rows – the signature: data as instrument output */
  .readout{padding:16px 22px;border-bottom:1px solid var(--line);}
  .row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;
    align-items:baseline;}
  .row .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-top:2px;}
  .row .v{font-size:13.5px;text-align:right;line-height:1.4;}
  .row .v.date{font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:14px;
    letter-spacing:.5px;font-weight:500;}

  .scroll{overflow-y:auto;flex:1;}
  .scroll::-webkit-scrollbar{width:8px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .sites-head{display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px 10px;}
  .sites-head h3{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--mute);margin:0;font-weight:500;}
  .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);
    border:1px solid var(--brass-d);border-radius:20px;padding:1px 9px;}

  .site{margin:0 14px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--ink2);cursor:pointer;transition:border-color .15s,transform .05s;
    overflow:hidden;}
  .site:hover{border-color:var(--brass-d);}
  .site:active{transform:scale(.995);}
  .site-top{display:flex;align-items:center;gap:11px;padding:12px 14px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;
    box-shadow:0 0 0 3px rgba(79,176,165,.18);}
  .site-name{font-size:14px;font-weight:500;line-height:1.25;}
  .site-est{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute);
    margin-top:2px;letter-spacing:.5px;}
  .site-body{max-height:0;opacity:0;transition:max-height .25s ease,opacity .2s;
    padding:0 14px;}
  .site.open .site-body{max-height:260px;opacity:1;padding:0 14px 14px 34px;}
  .site-body p{margin:0;font-size:12.5px;line-height:1.55;color:#cdd6da;}

  .intro,.empty{padding:22px;color:var(--mute);font-size:13.5px;line-height:1.65;}
  .intro strong{color:var(--parch);font-weight:600;}
  .intro .tip{margin-top:16px;padding:14px;border:1px dashed var(--line);border-radius:8px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--parch);}

  .back{margin:16px 22px 4px;display:inline-flex;align-items:center;gap:8px;
    background:none;border:1px solid var(--line);color:var(--parch);
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;
    padding:8px 14px;border-radius:6px;cursor:pointer;text-transform:uppercase;
    transition:border-color .15s,color .15s;}
  .back:hover{border-color:var(--brass);color:var(--brass);}

  .seed-note{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;
    color:#5f7079;padding:14px 22px 18px;border-top:1px solid var(--line);line-height:1.6;}

  /* ---- map markers ------------------------------------------------ */
  .pin{display:flex;align-items:center;justify-content:center;font-weight:600;
    font-family:'IBM Plex Mono',monospace;transition:transform .12s;}
  .pin.state{width:30px;height:30px;border-radius:50% 50% 50% 4px;
    background:var(--brass);color:#1a1206;transform:rotate(-45deg);
    box-shadow:0 3px 10px rgba(0,0,0,.5);border:1.5px solid #f0c96b;font-size:9.5px;}
  .pin.state span{transform:rotate(45deg);}
  .pin.state:hover{transform:rotate(-45deg) scale(1.12);}
  .pin.site{width:14px;height:14px;border-radius:50%;background:var(--teal);
    border:2px solid #bff0ea;box-shadow:0 0 0 4px rgba(79,176,165,.25),0 2px 6px rgba(0,0,0,.5);}
  .pin.site:hover{transform:scale(1.25);}

  .leaflet-popup-content-wrapper{background:var(--ink2);color:var(--parch);
    border:1px solid var(--brass-d);border-radius:10px;}
  .leaflet-popup-tip{background:var(--ink2);border:1px solid var(--brass-d);}
  .leaflet-popup-content{margin:14px 16px;font-family:'Inter',sans-serif;}
  .pop-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin-bottom:3px;}
  .pop-est{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);
    letter-spacing:1px;margin-bottom:8px;}
  .pop-body{font-size:12.5px;line-height:1.55;color:#cdd6da;max-width:230px;}

  .leaflet-container{background:#0a0f12;}
  .leaflet-bar a{background:var(--ink2);color:var(--parch);border-color:var(--line);}
  .leaflet-bar a:hover{background:var(--line);}

  /* ---- responsive: panel becomes bottom sheet --------------------- */
  @media (max-width:720px){
    :root{--panel-w:100%;}
    .panel{top:auto;bottom:0;height:52%;width:100%;border-left:none;
      border-top:1px solid var(--line);border-radius:16px 16px 0 0;
      box-shadow:0 -16px 40px rgba(0,0,0,.5);}
    .brand h1{font-size:24px;} .brand{top:14px;left:16px;}
  }
</style>
</head>
<body>
  <div id="map"></div>

  <div class="brand">
    <h1>Pin<span>point</span></h1>
    <p>Atlas of the United States</p>
  </div>

  <aside class="panel">
    <div id="panel-content"></div>
  </aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ==================================================================
   PINPOINT — seed dataset

   Fields:
     name, abbr, lat, lng      display + map pin location (approx. center)
     admitted   "MM/DD/YYYY"   statehood date (ratification for the original 13)
     order                     admission order, or note for D.C.
     origin                    short name-origin summary
     sites[]    { name, est, lat, lng, fact }
   NOTE: Dates & origins are best-effort seed data. Verify against NPS /
   U.S. Census / state archives before treating as authoritative.
   ================================================================== */
window.PINPOINT_STATES = [
  { name:"Alabama", abbr:"AL", lat:32.8, lng:-86.8, admitted:"12/14/1819", order:"22nd state",
    origin:"From the Alabama (Alibamu) people; often glossed from Choctaw as \u201cthicket clearers.\u201d", sites:[] },
  { name:"Alaska", abbr:"AK", lat:63.5, lng:-152.0, admitted:"01/03/1959", order:"49th state",
    origin:"From Aleut/Unangan \u201cAlaxsxaq\u201d \u2014 roughly \u201cthe mainland.\u201d", sites:[] },
  { name:"Arizona", abbr:"AZ", lat:34.3, lng:-111.7, admitted:"02/14/1912", order:"48th state",
    origin:"Likely from O\u2019odham \u201cali \u1e63onak\u201d (small spring); a Basque origin is also proposed.", sites:[] },
  { name:"Arkansas", abbr:"AR", lat:34.8, lng:-92.4, admitted:"06/15/1836", order:"25th state",

  { name:"California", abbr:"CA", lat:37.2, lng:-119.3, admitted:"09/09/1850", order:"31st state",
    origin:"From a mythical island in the 1510 Spanish romance \u201cLas Sergas de Esplandi\u00e1n.\u201d",
    sites:[
      { name:"Golden Gate Bridge", est:"Opened 1937", lat:37.8199, lng:-122.4783,
        fact:"When it opened it was the longest suspension-bridge span on Earth. Its \u201cInternational Orange\u201d color was chosen partly for visibility in San Francisco\u2019s fog." },
      { name:"Alcatraz Island", est:"Federal prison 1934\u20131963", lat:37.8267, lng:-122.4230,
        fact:"\u201cThe Rock\u201d held Al Capone and George \u201cMachine Gun\u201d Kelly. No confirmed successful escape was ever proven; the 1962 escape remains officially unsolved." },

  { name:"Colorado", abbr:"CO", lat:39.0, lng:-105.5, admitted:"08/01/1876", order:"38th state",

  { name:"Connecticut", abbr:"CT", lat:41.6, lng:-72.7, admitted:"01/09/1788", order:"5th state",

  { name:"Delaware", abbr:"DE", lat:39.0, lng:-75.5, admitted:"12/07/1787", order:"1st state",

      { name:"Kennedy Space Center", est:"Established 1962", lat:28.5729, lng:-80.6490,
        fact:"Launch site for every crewed U.S. Moon mission and the Space Shuttle. Launch Complex 39A sent Apollo 11 skyward on July 16, 1969." },
      { name:"St. Augustine (Old Town)", est:"Founded 1565", lat:29.8947, lng:-81.3145,

    ] },
  { name:"Georgia", abbr:"GA", lat:32.7, lng:-83.5, admitted:"01/02/1788", order:"4th state",

  { name:"Hawaii", abbr:"HI", lat:20.7, lng:-156.4, admitted:"08/21/1959", order:"50th state",

  { name:"Idaho", abbr:"ID", lat:44.4, lng:-114.6, admitted:"07/03/1890", order:"43rd state",

  { name:"Nebraska", abbr:"NE", lat:41.5, lng:-99.8, admitted:"03/01/1867", order:"37th state",
    origin:"From Otoe/Omaha \u201c\u00f1\u00ed br\u00e1sge\u201d \u2014 \u201cflat water\u201d (the Platte River).", sites:[] },
  { name:"Nevada", abbr:"NV", lat:39.3, lng:-116.6, admitted:"10/31/1864", order:"36th state",

    sites:[
      { name:"The Alamo", est:"Mission 1718; battle 1836", lat:29.4260, lng:-98.4861,
        fact:"A former Spanish mission in San Antonio. Its 1836 siege \u2014 and the cry \u201cRemember the Alamo!\u201d \u2014 became the rallying point of the Texas Revolution." },
      { name:"San Jacinto Monument", est:"Battle 1836", lat:29.7492, lng:-95.0808,
        fact:"Marks where Texas won its independence in an 18-minute battle. At 567 feet, the column is topped by a Lone Star and stands taller than the Washington Monument." }
    ] },
  { name:"Utah", abbr:"UT", lat:39.3, lng:-111.7, admitted:"01/04/1896", order:"45th state",
    origin:"From the Ute people.", sites:[] },
  { name:"Vermont", abbr:"VT", lat:44.1, lng:-72.7, admitted:"03/04/1791", order:"14th state",
    origin:"From French \u201cvert mont\u201d \u2014 \u201cgreen mountain.\u201d", sites:[] },
  { name:"Virginia", abbr:"VA", lat:37.5, lng:-78.8, admitted:"06/25/1788", order:"10th state",
    origin:"For Elizabeth I, England\u2019s \u201cVirgin Queen.\u201d", sites:[] },
  { name:"Washington", abbr:"WA", lat:47.4, lng:-120.5, admitted:"11/11/1889", order:"42nd state",
    origin:"For George Washington \u2014 the only U.S. state named after a president.", sites:[] },
  { name:"West Virginia", abbr:"WV", lat:38.6, lng:-80.6, admitted:"06/20/1863", order:"35th state",
    origin:"Split from Virginia during the Civil War; keeps the Virginia name.", sites:[] },
  { name:"Wisconsin", abbr:"WI", lat:44.6, lng:-89.9, admitted:"05/29/1848", order:"30th state",
    origin:"A French rendering of a Miami/Ojibwe river name; exact meaning uncertain.", sites:[] },
  { name:"Wyoming", abbr:"WY", lat:43.0, lng:-107.5, admitted:"07/10/1890", order:"44th state",
    origin:"From a Delaware (Lenape) word for \u201clarge prairie place,\u201d via Pennsylvania\u2019s Wyoming Valley.", sites:[] },
  { name:"Washington, D.C.", abbr:"DC", lat:38.9, lng:-77.03, admitted:"07/16/1790", order:"Federal district (not a state)",
    origin:"\u201cColumbia\u201d honors Christopher Columbus; the District was established by the Residence Act of 1790.",
    sites:[
      { name:"Lincoln Memorial", est:"Dedicated 1922", lat:38.8893, lng:-77.0502,
        fact:"Its 19-foot marble Lincoln faces the Mall. On its steps in 1963, Martin Luther King Jr. delivered the \u201cI Have a Dream\u201d speech." },
      { name:"Washington Monument", est:"Completed 1884", lat:38.8895, lng:-77.0353,
        fact:"A 555-foot marble obelisk. A funding gap mid-build left a visible color change in the stone about a third of the way up." },
      { name:"U.S. Capitol", est:"Cornerstone 1793", lat:38.8899, lng:-77.0091,
        fact:"Home of Congress. Its cast-iron dome was completed during the Civil War \u2014 Lincoln insisted work continue as a sign the Union would endure." },
      { name:"The White House", est:"Completed 1800", lat:38.8977, lng:-77.0365,
        fact:"Every president except George Washington has lived here. British troops burned it in 1814; it was rebuilt and reoccupied by 1817." }
    ] }
];

</script>
<script>
/* ================================================================
   PINPOINT — prototype interaction layer
   Data lives in data/states.js as window.PINPOINT_STATES
   ================================================================ */
const USA_VIEW = { center:[38.5,-96.5], zoom:4 };
const map = L.map('map',{ zoomControl:true, minZoom:3, maxZoom:18, worldCopyJump:false })
  .setView(USA_VIEW.center, USA_VIEW.zoom);

// Satellite basemap + a light labels/roads reference overlay (both free, no key).
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution:'Imagery © Esri, Maxar, Earthstar Geographics', maxZoom:18 }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom:18, opacity:.9 }).addTo(map);

const STATES = window.PINPOINT_STATES;
const panel = document.getElementById('panel-content');
let stateLayer = L.layerGroup().addTo(map);
let siteLayer  = L.layerGroup().addTo(map);
let siteMarkers = {};

/* ---- helpers ---------------------------------------------------- */
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stateIcon(abbr){
  return L.divIcon({ className:'', html:`<div class="pin state"><span>${abbr}</span></div>`,
    iconSize:[30,30], iconAnchor:[15,28] });
}
function siteIcon(){
  return L.divIcon({ className:'', html:`<div class="pin site"></div>`,
    iconSize:[14,14], iconAnchor:[7,7] });
}

/* ---- intro / home ---------------------------------------------- */
function renderIntro(){
  panel.innerHTML = `
    <div class="panel-head">
      <span class="eyebrow">Field Guide</span>
      <h2>Start exploring</h2>
    </div>
    <div class="intro">
      <p><strong>Pinpoint</strong> maps the story of every U.S. state — when it joined the
      Union, where its name came from, and the historic sites worth standing in front of.</p>
      <p>Pick any <strong>brass marker</strong> to open a state dossier. Its historic sites
      drop onto the map and list here on the right. Tap a site for the details.</p>
      <div class="tip">▸ Try New York, D.C., California, Florida,<br>&nbsp;&nbsp;Massachusetts, Pennsylvania, or Texas —<br>&nbsp;&nbsp;those are seeded with sites.</div>
    </div>
    <div class="seed-note">
      SEED DATA — prototype. Statehood dates &amp; name origins cover all 50 states + D.C.;
      historic sites are seeded for a handful. Verify against authoritative sources
      (NPS, Census, state archives) before publishing.
    </div>`;
}

/* ---- state dossier --------------------------------------------- */
function renderState(st){
  const sites = st.sites || [];
  const sitesHTML = sites.length
    ? sites.map((s,i)=>`
        <div class="site" data-i="${i}">
          <div class="site-top">
            <span class="dot"></span>
            <div>
              <div class="site-name">${esc(s.name)}</div>
              <div class="site-est">${esc(s.est)}</div>
            </div>
          </div>
          <div class="site-body"><p>${esc(s.fact)}</p></div>
        </div>`).join('')
    : `<div class="empty">No historic sites seeded for this state yet — this is where
        the National Park Service &amp; Wikidata feeds plug in. The dossier above is live.</div>`;

  panel.innerHTML = `
    <button class="back">◂ Back to the U.S.</button>
    <div class="panel-head">
      <span class="eyebrow">State Dossier</span>
      <h2>${esc(st.name)}<span class="abbr">${esc(st.abbr)}</span></h2>
    </div>
    <div class="readout">
      <div class="row"><span class="k">${st.abbr==='DC'?'Established':'Joined Union'}</span>
        <span class="v date">${esc(st.admitted)}</span></div>
      <div class="row"><span class="k">Order</span><span class="v">${esc(st.order)}</span></div>
      <div class="row"><span class="k">Name origin</span><span class="v">${esc(st.origin)}</span></div>
    </div>
    <div class="scroll">
      <div class="sites-head"><h3>Historic Sites</h3><span class="count">${sites.length}</span></div>
      ${sitesHTML}
    </div>`;

  panel.querySelector('.back').onclick = resetToUSA;
  panel.querySelectorAll('.site').forEach(el=>{
    el.onclick = ()=> selectSite(st, +el.dataset.i, el);
  });
}

/* ---- selection flow -------------------------------------------- */
function selectState(st){
  siteLayer.clearLayers(); siteMarkers = {};
  renderState(st);
  const sites = st.sites || [];
  if(sites.length){
    const pts = [];
    sites.forEach((s,i)=>{
      const m = L.marker([s.lat,s.lng],{icon:siteIcon()})
        .addTo(siteLayer)
        .bindPopup(`<div class="pop-name">${esc(s.name)}</div>
                    <div class="pop-est">${esc(s.est)}</div>
                    <div class="pop-body">${esc(s.fact)}</div>`,
                    {maxWidth:260,offset:[0,-4]});
      m.on('click',()=>highlightListItem(i));
      siteMarkers[i]=m; pts.push([s.lat,s.lng]);
    });
    const b = L.latLngBounds(pts).pad(0.4);
    map.flyToBounds(b,{maxZoom:11,duration:1.1,paddingTopLeft:[0,60],paddingBottomRight:[panelPad(),0]});
  }else{
    map.flyTo([st.lat,st.lng], 6, {duration:1.1});
  }
}

function selectSite(st,i,el){
  const opened = el.classList.contains('open');
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  if(!opened) el.classList.add('open');
  const m = siteMarkers[i];
  if(m){ map.flyTo([st.sites[i].lat,st.sites[i].lng], 13,{duration:1}); m.openPopup(); }
}

function highlightListItem(i){
  const el = panel.querySelector(`.site[data-i="${i}"]`);
  if(!el) return;
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  el.classList.add('open');
  el.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetToUSA(){
  siteLayer.clearLayers(); siteMarkers={};
  map.flyTo(USA_VIEW.center, USA_VIEW.zoom,{duration:1.1});
  renderIntro();
}

function panelPad(){ return window.innerWidth<=720 ? 0 : 380; }

/* ---- boot ------------------------------------------------------- */
STATES.forEach(st=>{
  L.marker([st.lat,st.lng],{icon:stateIcon(st.abbr),title:st.name})
    .addTo(stateLayer)
    .on('click',()=>selectState(st));
});
renderIntro();
</script>
</body>
</html>
