<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pinpoint — An Interactive Atlas of the United States</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0B1013; --ink2:#131C22; --line:#24333C;
    --brass:#D9A441; --brass-d:#A87A28; --teal:#4FB0A5;
    --city:#6FA8DC; --city-d:#3E6D96;
    --parch:#ECE6D8; --mute:#8A9BA5;
    --panel-w:390px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--parch);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #map{position:absolute;inset:0;background:#060a0d;z-index:1;}

  /* cinematic vignette — depth around the edges (wave-atlas mood) */
  .vignette{position:absolute;inset:0;z-index:400;pointer-events:none;
    background:radial-gradient(120% 90% at 40% 45%,transparent 55%,rgba(3,6,9,.55) 100%);}

  /* ---- wordmark ---------------------------------------------------- */
  .brand{position:absolute;top:18px;left:20px;z-index:1000;pointer-events:none;}
  .brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:30px;letter-spacing:.5px;
    margin:0;line-height:1;color:var(--parch);text-shadow:0 2px 16px rgba(0,0,0,.85);}
  .brand h1 span{color:var(--brass);}
  .brand p{margin:5px 0 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--mute);text-shadow:0 1px 10px rgba(0,0,0,.95);}

  /* ---- basemap toggle --------------------------------------------- */
  .basemap{position:absolute;bottom:22px;left:20px;z-index:1000;display:flex;
    background:rgba(11,16,19,.82);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .basemap button{background:none;border:none;color:var(--mute);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.2px;
    text-transform:uppercase;padding:9px 14px;transition:color .15s,background .15s;}
  .basemap button.on{color:#1a1206;background:var(--brass);}
  .basemap button:not(.on):hover{color:var(--parch);}

  /* ---- dossier / home panel --------------------------------------- */
  .panel{position:absolute;top:0;right:0;height:100%;width:var(--panel-w);z-index:1000;
    background:linear-gradient(180deg,rgba(11,16,19,.94),rgba(11,16,19,.985));
    border-left:1px solid var(--line);backdrop-filter:blur(10px);
    display:flex;flex-direction:column;box-shadow:-18px 0 46px rgba(0,0,0,.5);
    transform:translateX(105%);transition:transform .38s cubic-bezier(.4,0,.2,1);}
  .panel.open{transform:translateX(0);}

  /* ---- search FAB: the only thing visible before you pick a state/city */
  .search-fab{position:absolute;top:18px;right:20px;z-index:1001;width:44px;height:44px;
    border-radius:50%;background:rgba(11,16,19,.82);border:1px solid var(--line);
    color:var(--parch);display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);transition:border-color .15s,transform .05s;}
  .search-fab:hover{border-color:var(--brass-d);}
  .search-fab:active{transform:scale(.95);}
  .panel-head{padding:22px 22px 16px;border-bottom:1px solid var(--line);}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--brass);margin-bottom:9px;display:block;}
  .panel-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:27px;margin:0;line-height:1.06;}
  .panel-head p{margin:12px 0 0;font-size:13.5px;line-height:1.6;color:var(--mute);}
  .abbr{font-family:'IBM Plex Mono',monospace;color:var(--mute);font-size:13px;margin-left:8px;}

  #panel-content{display:flex;flex-direction:column;height:100%;min-height:0;}
  .scroll{overflow-y:auto;flex:1;min-height:0;}
  .scroll::-webkit-scrollbar{width:8px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---- search ------------------------------------------------------ */
  .search-wrap{padding:16px 22px 8px;position:relative;}
  .search-wrap input{width:100%;background:var(--ink2);border:1px solid var(--line);
    border-radius:9px;color:var(--parch);font-family:'Inter',sans-serif;font-size:14px;
    padding:12px 14px 12px 38px;outline:none;transition:border-color .15s;}
  .search-wrap input:focus{border-color:var(--brass-d);}
  .search-wrap input::placeholder{color:#5f7079;}
  .search-ico{position:absolute;left:34px;top:29px;color:var(--mute);pointer-events:none;}
  .results{margin:8px 14px 0;}
  .result{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
    cursor:pointer;transition:background .12s;}
  .result:hover{background:var(--ink2);}
  .result .tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:1px;
    text-transform:uppercase;padding:2px 6px;border-radius:4px;flex:none;}
  .tag.state{color:var(--brass);border:1px solid var(--brass-d);}
  .tag.site{color:var(--teal);border:1px solid #2f6b64;}
  .tag.city{color:var(--city);border:1px solid var(--city-d);}
  .result .rname{font-size:13.5px;}
  .result .rsub{font-size:11px;color:var(--mute);}

  /* ---- discovery modes -------------------------------------------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 22px 6px;}
  .mode{display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;
    background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:15px;
    cursor:pointer;color:var(--parch);transition:border-color .15s,transform .05s;}
  .mode:hover{border-color:var(--brass-d);}
  .mode:active{transform:scale(.985);}
  .mode svg{color:var(--brass);}
  .mode .mt{font-size:14px;font-weight:600;}
  .mode .ms{font-size:11px;color:var(--mute);line-height:1.35;}

  /* ---- editorial picks -------------------------------------------- */
  .section-h{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;
    text-transform:uppercase;color:var(--mute);padding:18px 22px 8px;}
  .pick{display:flex;align-items:center;gap:12px;margin:0 14px 8px;padding:11px 14px;
    border:1px solid var(--line);border-radius:9px;background:var(--ink2);cursor:pointer;
    transition:border-color .15s,transform .05s;}
  .pick:hover{border-color:var(--teal);}
  .pick:active{transform:scale(.99);}
  .pick .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;
    box-shadow:0 0 0 3px rgba(79,176,165,.18);}
  .pick .pname{font-size:13.5px;font-weight:500;}
  .pick .ploc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute);margin-top:2px;}

  /* ---- state dossier ---------------------------------------------- */
  .readout{padding:16px 22px;border-bottom:1px solid var(--line);}
  .row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;align-items:baseline;}
  .row .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-top:2px;}
  .row .v{font-size:13.5px;text-align:right;line-height:1.4;}
  .row .v.date{font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:14px;
    letter-spacing:.5px;font-weight:500;}

  .sites-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 10px;}
  .sites-head h3{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--mute);margin:0;font-weight:500;}
  .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);
    border:1px solid var(--brass-d);border-radius:20px;padding:1px 9px;}

  .site{margin:0 14px 8px;border:1px solid var(--line);border-radius:9px;background:var(--ink2);
    cursor:pointer;transition:border-color .15s,transform .05s;overflow:hidden;}
  .site:hover{border-color:var(--brass-d);}
  .site:active{transform:scale(.995);}
  .site-top{display:flex;align-items:center;gap:11px;padding:12px 14px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;
    box-shadow:0 0 0 3px rgba(79,176,165,.18);}
  .dot.city{background:var(--city);box-shadow:0 0 0 3px rgba(111,168,220,.2);}
  .site-name{font-size:14px;font-weight:500;line-height:1.25;}
  .site-est{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute);
    margin-top:2px;letter-spacing:.5px;}
  .site-body{max-height:0;opacity:0;transition:max-height .3s ease,opacity .2s;padding:0 14px;}
  .site.open .site-body{max-height:430px;opacity:1;padding:0 14px 14px 34px;}
  .site-body p{margin:0 0 8px;font-size:12.5px;line-height:1.55;color:#cdd6da;}
  .site-body p:last-child{margin-bottom:0;}

  /* ---- photo gallery: scrollable image strip atop the description --- */
  .gallery{position:relative;margin:2px 0 10px;border-radius:8px;overflow:hidden;
    background:#060a0d;border:1px solid var(--line);}
  .gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x proximity;
    scrollbar-width:none;-ms-overflow-style:none;}
  .gallery-track::-webkit-scrollbar{display:none;}
  .gallery-slide{flex:0 0 100%;scroll-snap-align:start;}
  .gallery-slide img{width:100%;height:150px;object-fit:cover;display:block;}
  .gallery-status{padding:16px 14px;font-size:11.5px;color:var(--mute);text-align:center;}
  .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;
    border-radius:50%;background:rgba(11,16,19,.72);border:1px solid rgba(236,230,216,.28);
    color:var(--parch);display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:12px;line-height:1;user-select:none;transition:background .15s;}
  .gallery-nav:hover{background:rgba(11,16,19,.92);}
  .gallery-nav.prev{left:6px;} .gallery-nav.next{right:6px;}
  .gallery-dots{display:flex;gap:5px;justify-content:center;padding:7px 0;background:#060a0d;}
  .gallery-dots span{width:5px;height:5px;border-radius:50%;background:rgba(236,230,216,.25);}
  .gallery-dots span.on{background:var(--brass);}

  .empty{padding:20px 22px;color:var(--mute);font-size:13px;line-height:1.6;}

  .back{margin:16px 22px 4px;display:inline-flex;align-items:center;gap:8px;background:none;
    border:1px solid var(--line);color:var(--parch);font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:1px;padding:8px 14px;border-radius:6px;cursor:pointer;
    text-transform:uppercase;transition:border-color .15s,color .15s;}
  .back:hover{border-color:var(--brass);color:var(--brass);}

  .seed-note{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;
    color:#566670;padding:16px 22px 20px;border-top:1px solid var(--line);line-height:1.6;}

  /* ---- map markers: needle pins ----------------------------------- */
  .pin{transition:transform .12s ease;transform-origin:50% 100%;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));cursor:pointer;}
  .pin svg{display:block;}
  .pin:hover{transform:translateY(-2px) scale(1.08);}

  .leaflet-popup-content-wrapper{background:var(--ink2);color:var(--parch);
    border:1px solid var(--brass-d);border-radius:10px;}
  .leaflet-popup-tip{background:var(--ink2);border:1px solid var(--brass-d);}
  .leaflet-popup-content{margin:14px 16px;font-family:'Inter',sans-serif;}
  .pop-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin-bottom:3px;}
  .pop-est{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);
    letter-spacing:1px;margin-bottom:8px;}
  .pop-body{font-size:12.5px;line-height:1.55;color:#cdd6da;max-width:230px;}
  .leaflet-container{background:#060a0d;}
  .leaflet-bar a{background:var(--ink2);color:var(--parch);border-color:var(--line);}
  .leaflet-bar a:hover{background:var(--line);}
  .leaflet-control-attribution{background:rgba(11,16,19,.7)!important;color:#6b7c85!important;}
  .leaflet-control-attribution a{color:#8a9ba5!important;}

  /* ---- responsive ------------------------------------------------- */
  @media (max-width:720px){
    :root{--panel-w:100%;}
    .panel{top:auto;bottom:0;height:56%;width:100%;border-left:none;border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;box-shadow:0 -18px 46px rgba(0,0,0,.55);
      transform:translateY(105%);}
    .panel.open{transform:translateY(0);}
    .brand h1{font-size:24px;} .brand{top:14px;left:16px;}
    .basemap{bottom:calc(56% + 14px);left:16px;}
    .search-fab{top:14px;right:16px;}
  }
</style>
</head>
<body>
  <div id="map"></div>
  <div class="vignette"></div>

  <div class="brand">
    <h1>Pin<span>point</span></h1>
    <p>Atlas of the United States</p>
  </div>

  <div class="basemap">
    <button id="bm-sat" class="on">Satellite</button>
    <button id="bm-night">Night lights</button>
  </div>

  <button class="search-fab" id="search-fab" title="Search &amp; browse" aria-label="Search and browse">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
  </button>

  <aside class="panel"><div id="panel-content"></div></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ==================================================================
   PINPOINT — seed dataset
   window.PINPOINT_STATES : one record per state (+ D.C.)
   Fields:
     name, abbr, lat, lng      display + map pin location (approx. center)
     admitted   "MM/DD/YYYY"   statehood date (ratification for the original 13)
     order                     admission order, or note for D.C.
     origin                    short name-origin summary
     sites[]    { name, est, lat, lng, fact }
   NOTE: Dates & origins are best-effort seed data. Verify against NPS /
   U.S. Census / state archives before treating as authoritative.
   ================================================================== */
window.PINPOINT_STATES = [
  { name:"Alabama", abbr:"AL", lat:32.8, lng:-86.8, admitted:"12/14/1819", order:"22nd state",
    origin:"From the Alabama (Alibamu) people; often glossed from Choctaw as \u201cthicket clearers.\u201d", sites:[], cities:[ { name:"Birmingham", lat:33.5207, lng:-86.8025, founded:"1871", origin:"Named for Birmingham, England, an ironworking center its founders hoped to rival.", fact:"Nicknamed the 'Magic City' for how fast it grew once local iron ore, coal, and limestone let it become the South's great steel town." } ] },
  { name:"Alaska", abbr:"AK", lat:63.5, lng:-152.0, admitted:"01/03/1959", order:"49th state",
    origin:"From Aleut/Unangan \u201cAlaxsxaq\u201d \u2014 roughly \u201cthe mainland.\u201d", sites:[], cities:[ { name:"Anchorage", lat:61.2181, lng:-149.9003, founded:"1914", origin:"Named for the ship anchorage on Cook Inlet used during construction of the Alaska Railroad.", fact:"Started as a tent camp for railroad workers and is now home to nearly 40% of the entire state's population." } ] },
  { name:"Arizona", abbr:"AZ", lat:34.3, lng:-111.7, admitted:"02/14/1912", order:"48th state",
    origin:"Likely from O\u2019odham \u201cali \u1e63onak\u201d (small spring); a Basque origin is also proposed.", sites:[], cities:[ { name:"Phoenix", lat:33.4484, lng:-112.0740, founded:"1868", origin:"Named by \"Lord\" Darrell Duppa for the mythical bird, since the town rose atop the ruins of the ancient Hohokam civilization's canals.", fact:"Those 1,000-year-old Hohokam canals were re-dug by the city's founders and are still the basis of part of the Valley's canal system today." } ] },
  { name:"Arkansas", abbr:"AR", lat:34.8, lng:-92.4, admitted:"06/15/1836", order:"25th state",
    origin:"A French rendering of a Sioux word for the Quapaw people.", sites:[], cities:[ { name:"Little Rock", lat:34.7465, lng:-92.2896, founded:"1821", origin:"Named for \"la petite roche,\" a small rock outcrop French explorer Bernard de la Harpe used as a river landmark in 1722.", fact:"That original little rock is still visible today, near the base of the Junction Bridge on the Arkansas River." } ] },
  { name:"California", abbr:"CA", lat:37.2, lng:-119.3, admitted:"09/09/1850", order:"31st state",
    origin:"From a mythical island in the 1510 Spanish romance \u201cLas Sergas de Esplandi\u00e1n.\u201d",
    sites:[
      { name:"Golden Gate Bridge", est:"Opened 1937", lat:37.8199, lng:-122.4783,
        fact:"When it opened it was the longest suspension-bridge span on Earth. Its \u201cInternational Orange\u201d color was chosen partly for visibility in San Francisco\u2019s fog." },
      { name:"Alcatraz Island", est:"Federal prison 1934\u20131963", lat:37.8267, lng:-122.4230,
        fact:"\u201cThe Rock\u201d held Al Capone and George \u201cMachine Gun\u201d Kelly. No confirmed successful escape was ever proven; the 1962 escape remains officially unsolved." },
      { name:"Yosemite National Park", est:"Protected 1864", lat:37.8651, lng:-119.5383,
        fact:"Lincoln signed the Yosemite Grant during the Civil War \u2014 the first time the U.S. set aside land specifically for preservation, seeding the national-park idea." }
    ], cities:[ { name:"Los Angeles", lat:34.0522, lng:-118.2437, founded:"1781", origin:"Founded by Spanish settlers as 'El Pueblo de Nuestra Se\u00f1ora la Reina de los \u00c1ngeles' \u2014 'the Town of Our Lady, Queen of the Angels.'", fact:"Its original 44 settlers were a small, ethnically mixed group of Spanish, Indigenous, and African ancestry recruited from Mexico." } ] },
  { name:"Colorado", abbr:"CO", lat:39.0, lng:-105.5, admitted:"08/01/1876", order:"38th state",
    origin:"Spanish for \u201ccolored/reddish,\u201d after the silt-laden Colorado River.", sites:[], cities:[ { name:"Denver", lat:39.7392, lng:-104.9903, founded:"1858", origin:"Named for Gen. James W. Denver, governor of Kansas Territory, by founders currying favor \u2014 he had actually already resigned before they arrived.", fact:"Its official elevation of 5,280 feet earns it the nickname 'the Mile High City'; a step on the State Capitol steps marks the exact spot." } ] },
  { name:"Connecticut", abbr:"CT", lat:41.6, lng:-72.7, admitted:"01/09/1788", order:"5th state",
    origin:"From Mohegan-Pequot \u201cquinnitukqut\u201d \u2014 \u201cat the long tidal river.\u201d", sites:[], cities:[ { name:"Hartford", lat:41.7658, lng:-72.6734, founded:"1635", origin:"Named after Hertford, England, the hometown of an early settler.", fact:"Home to the oldest publicly funded park in America (Bushnell Park, 1854) and the insurance industry that gave it the nickname 'the Insurance Capital of the World.'" } ] },
  { name:"Delaware", abbr:"DE", lat:39.0, lng:-75.5, admitted:"12/07/1787", order:"1st state",
    origin:"For Lord De La Warr (Thomas West), an early governor of Virginia.", sites:[], cities:[ { name:"Wilmington", lat:39.7391, lng:-75.5398, founded:"1739", origin:"Named for Spencer Compton, Earl of Wilmington, when it received its borough charter.", fact:"Swedish colonists had already settled the site in 1638 as Fort Christina \u2014 one of the very first European settlements in the Delaware Valley." } ] },
  { name:"Florida", abbr:"FL", lat:28.6, lng:-82.4, admitted:"03/03/1845", order:"27th state",
    origin:"Spanish \u201cPascua Florida\u201d (Feast of Flowers/Easter), named by Ponce de Le\u00f3n in 1513.",
    sites:[
      { name:"Castillo de San Marcos", est:"Built 1672\u20131695", lat:29.8975, lng:-81.3115,
        fact:"In St. Augustine \u2014 the oldest masonry fort in the continental U.S. Its walls are coquina, a soft shell-stone that absorbed cannonballs instead of shattering." },
      { name:"Kennedy Space Center", est:"Established 1962", lat:28.5729, lng:-80.6490,
        fact:"Launch site for every crewed U.S. Moon mission and the Space Shuttle. Launch Complex 39A sent Apollo 11 skyward on July 16, 1969." },
      { name:"St. Augustine (Old Town)", wiki:"St. Augustine, Florida", est:"Founded 1565", lat:29.8947, lng:-81.3145,
        fact:"The oldest continuously occupied European-established settlement in the continental U.S. \u2014 predating Jamestown by 42 years." }
    ], cities:[ { name:"Miami", lat:25.7617, lng:-80.1918, founded:"1896", origin:"From the Mayaimi people and Lake Mayaimi (now Lake Okeechobee), a name often glossed 'big water.'", fact:"Julia Tuttle, the only woman to found a major American city, convinced Henry Flagler to extend his railroad here after a hard 1894 freeze spared Miami's citrus." } ] },
  { name:"Georgia", abbr:"GA", lat:32.7, lng:-83.5, admitted:"01/02/1788", order:"4th state",
    origin:"Named for King George II of Great Britain.", sites:[], cities:[ { name:"Atlanta", lat:33.7490, lng:-84.3880, founded:"1837", origin:"Began as 'Terminus,' the end of the line for the Western & Atlantic Railroad; the name Atlanta is a feminine form of 'Atlantic,' honoring that railroad.", fact:"It was burned during Sherman's 1864 March to the Sea and rebuilt so fast its later motto became 'Resurgens' \u2014 Latin for 'rising again.'" } ] },
  { name:"Hawaii", abbr:"HI", lat:20.7, lng:-156.4, admitted:"08/21/1959", order:"50th state",
    origin:"Possibly from \u201cHawaiki,\u201d the legendary Polynesian homeland.", sites:[], cities:[ { name:"Honolulu", lat:21.3069, lng:-157.8583, founded:"1794", origin:"A Hawaiian name meaning 'sheltered bay' or 'calm port,' describing its harbor.", fact:"Became the capital of the Kingdom of Hawai'i under Kamehameha III in 1845, decades before statehood." } ] },

const satGroup = L.layerGroup([satImagery, satLabels]);
satGroup.addTo(map);
let currentBase = 'sat';
function setBase(mode){
  if(mode===currentBase) return;
  if(mode==='night'){ map.removeLayer(satGroup); nightLights.addTo(map); }

  document.getElementById('bm-sat').classList.toggle('on', mode==='sat');
  document.getElementById('bm-night').classList.toggle('on', mode==='night');
}

const panelEl = document.querySelector('.panel');
const panel  = document.getElementById('panel-content');
let stateLayer = L.layerGroup().addTo(map);
let siteLayer  = L.layerGroup().addTo(map);
let cityLayer  = L.layerGroup().addTo(map);
let cityHighlight = L.layerGroup().addTo(map);
let siteMarkers = {};
let cityMarkers = {};
let CURRENT_STATE = null;
const IMAGE_CACHE = {};

function showPanel(){ panelEl.classList.add('open'); }
function hidePanel(){ panelEl.classList.remove('open'); }

// flat search index + editorial picks
const SEARCH_INDEX = [];
STATES.forEach(st=>{
  SEARCH_INDEX.push({ label:st.name, sub:st.order, type:'state', abbr:st.abbr });
  (st.sites||[]).forEach((s,i)=> SEARCH_INDEX.push({ label:s.name, sub:st.name, type:'site', abbr:st.abbr, i }));
  (st.cities||[]).forEach((c,i)=> SEARCH_INDEX.push({ label:c.name, sub:st.name, type:'city', abbr:st.abbr, i }));
});
const PICKS = [
  ['NY','Statue of Liberty'], ['PA','Independence Hall'], ['TX','The Alamo'],
  ['CA','Golden Gate Bridge'], ['DC','Lincoln Memorial'], ['FL','Castillo de San Marcos']
];

/* helpers -------------------------------------------------------- */
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byAbbr = a => STATES.find(s=>s.abbr===a);
function siteIndex(st,name){ return (st.sites||[]).findIndex(s=>s.name===name); }
function stateIcon(a){
  return L.divIcon({ className:'', iconSize:[30,42], iconAnchor:[15,42], popupAnchor:[0,-30],
    html:`<div class="pin"><svg width="30" height="42" viewBox="0 0 30 42" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 41.5 L12.4 20.5 H17.6 Z" fill="#cdd3da" stroke="#9aa2ab" stroke-width=".5"/>
      <circle cx="15" cy="14" r="12.5" fill="#D9A441" stroke="#f0c96b" stroke-width="1.5"/>
      <circle cx="10.6" cy="9.6" r="3.4" fill="#f4d489" opacity=".7"/>
      <text x="15" y="17.6" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-weight="600" font-size="10" fill="#1a1206">${a}</text>
    </svg></div>` });
}
function siteIcon(){
  return L.divIcon({ className:'', iconSize:[20,30], iconAnchor:[10,30], popupAnchor:[0,-22],
    html:`<div class="pin"><svg width="20" height="30" viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 29.5 L8.3 15 H11.7 Z" fill="#cdd3da" stroke="#9aa2ab" stroke-width=".5"/>
      <circle cx="10" cy="9" r="8" fill="#4FB0A5" stroke="#bff0ea" stroke-width="1.5"/>
      <circle cx="7.4" cy="6.4" r="2.2" fill="#bff0ea" opacity=".65"/>
    </svg></div>` });
}
function cityIcon(){
  return L.divIcon({ className:'', iconSize:[16,16], iconAnchor:[8,8], popupAnchor:[0,-8],
    html:`<div class="pin"><svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="12" height="12" rx="3" transform="rotate(45 8 8)"
        fill="#6FA8DC" stroke="#cfe3f5" stroke-width="1.5"/>
    </svg></div>` });
}
function panelPad(){ return window.innerWidth<=720 ? 0 : 390; }

const ICONS = {
  wander:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 10.5 10.5 8.5 15.5 13.5 13.5"/></svg>',
  nearby:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>'
};

/* ---- HOME (discovery) ------------------------------------------ */
function renderHome(){
  panel.innerHTML = `
    <div class="panel-head">
      <span class="eyebrow">Field Guide</span>
      <h2>The country is waiting.</h2>
      <p>Wander into a landmark, explore what\u2019s near you, or search all 50 states + D.C.</p>
    </div>
    <div class="scroll">
      <div class="search-wrap">
        <span class="search-ico">${ICONS.search}</span>
        <input id="q" type="text" placeholder="Search a state or historic site\u2026" autocomplete="off">
      </div>
      <div id="results" class="results"></div>
      <div id="browse">
        <div class="modes">
          <button class="mode" id="m-wander">${ICONS.wander}
            <span class="mt">Wander</span>
            <span class="ms">Drop me at a landmark at random.</span></button>
          <button class="mode" id="m-nearby">${ICONS.nearby}
            <span class="mt">Explore nearby</span>
            <span class="ms">Jump to the state I\u2019m in.</span></button>
        </div>
        <div class="section-h">Editorial Picks</div>
        ${PICKS.map(([a,n])=>{const st=byAbbr(a);return `
          <div class="pick" data-a="${a}" data-n="${esc(n)}">
            <span class="dot"></span>
            <div><div class="pname">${esc(n)}</div><div class="ploc">${esc(st.name)}</div></div>
          </div>`;}).join('')}
      </div>
      <div class="seed-note">
        SEED DATA \u2014 prototype. Statehood dates &amp; name origins cover all 50 states + D.C.;
        every state has one seeded city so far (its founding date, name origin, and a fact);
        historic sites are seeded for CA, FL, MA, NY, PA, TX &amp; D.C. Coverage is expanding
        alphabetically \u2014 verify against NPS / Census / state archives before publishing.
      </div>
    </div>`;

  // search
  const q = panel.querySelector('#q');
  const results = panel.querySelector('#results');
  const browse = panel.querySelector('#browse');
  q.oninput = ()=>{
    const v = q.value.trim().toLowerCase();
    if(!v){ results.innerHTML=''; browse.style.display=''; return; }
    browse.style.display='none';
    const hits = SEARCH_INDEX.filter(x=>x.label.toLowerCase().includes(v)).slice(0,8);
    results.innerHTML = hits.length ? hits.map(h=>`
      <div class="result" data-type="${h.type}" data-a="${h.abbr}" ${h.i!=null?`data-i="${h.i}"`:''}>
        <span class="tag ${h.type}">${h.type}</span>
        <div><div class="rname">${esc(h.label)}</div><div class="rsub">${esc(h.sub)}</div></div>
      </div>`).join('') : `<div class="empty">No matches for \u201c${esc(q.value)}\u201d.</div>`;
    results.querySelectorAll('.result').forEach(el=>{
      el.onclick = ()=>{
        const st = byAbbr(el.dataset.a);
        if(el.dataset.type==='site') selectState(st, +el.dataset.i);
        else if(el.dataset.type==='city') selectState(st, null, +el.dataset.i);
        else selectState(st);
      };
    });
  };

  panel.querySelector('#m-wander').onclick = wander;
  panel.querySelector('#m-nearby').onclick = exploreNearby;
  panel.querySelectorAll('.pick').forEach(el=>{
    el.onclick = ()=>{ const st=byAbbr(el.dataset.a); selectState(st, siteIndex(st,el.dataset.n)); };
  });
}

/* ---- discovery actions ----------------------------------------- */
function wander(){
  const withSites = STATES.filter(s=>(s.sites||[]).length);
  const st = withSites[Math.floor(Math.random()*withSites.length)];
  const i = Math.floor(Math.random()*st.sites.length);
  selectState(st, i);
}
function exploreNearby(){
  const nearest = pos=>{
    const {latitude:la,longitude:lo}=pos.coords;
    let best=STATES[0],bd=Infinity;
    STATES.forEach(s=>{const d=(s.lat-la)**2+(s.lng-lo)**2; if(d<bd){bd=d;best=s;}});
    selectState(best);
  };
  if(!navigator.geolocation){ flashNearbyError(); return; }
  navigator.geolocation.getCurrentPosition(nearest, flashNearbyError, {timeout:8000});
}
function flashNearbyError(){
  const m=panel.querySelector('#m-nearby');
  if(m){ const s=m.querySelector('.ms'); s.textContent='Location unavailable \u2014 try search instead.'; s.style.color='#c98b8b'; }
}

/* ---- STATE dossier --------------------------------------------- */
function renderState(st){
  const sites = st.sites||[];
  const cities = (st.cities||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const sitesHTML = sites.length
    ? sites.map((s,i)=>`
      <div class="site" data-kind="site" data-i="${i}">
        <div class="site-top"><span class="dot"></span>
          <div><div class="site-name">${esc(s.name)}</div><div class="site-est">${esc(s.est)}</div></div>
        </div>
        <div class="site-body">
          <div class="gallery" data-loaded="0"></div>
          <p>${esc(s.fact)}</p>
        </div>
      </div>`).join('')
    : `<div class="empty">No historic sites seeded here yet \u2014 this is where the NPS &amp;
        Wikidata feeds plug in. The dossier above is live.</div>`;
  const citiesHTML = cities.length
    ? cities.map(c=>{
        const i = st.cities.indexOf(c);
        return `
      <div class="site" data-kind="city" data-i="${i}">
        <div class="site-top"><span class="dot city"></span>
          <div><div class="site-name">${esc(c.name)}</div><div class="site-est">Founded ${esc(c.founded)}</div></div>
        </div>
        <div class="site-body"><p><strong>Name origin:</strong> ${esc(c.origin)}</p><p>${esc(c.fact)}</p></div>
      </div>`;}).join('')
    : `<div class="empty">No cities seeded here yet.</div>`;

  panel.innerHTML = `
    <button class="back">\u25c2 Back to the U.S.</button>
    <div class="panel-head">
      <span class="eyebrow">State Dossier</span>
      <h2>${esc(st.name)}<span class="abbr">${esc(st.abbr)}</span></h2>
    </div>
    <div class="readout">
      <div class="row"><span class="k">${st.abbr==='DC'?'Established':'Joined Union'}</span>
        <span class="v date">${esc(st.admitted)}</span></div>
      <div class="row"><span class="k">Order</span><span class="v">${esc(st.order)}</span></div>
      <div class="row"><span class="k">Name origin</span><span class="v">${esc(st.origin)}</span></div>
    </div>
    <div class="scroll">
      <div class="sites-head"><h3>Cities</h3><span class="count">${cities.length}</span></div>
      ${citiesHTML}
      <div class="sites-head"><h3>Historic Sites</h3><span class="count">${sites.length}</span></div>
      ${sitesHTML}
    </div>`;

  panel.querySelector('.back').onclick = resetToUSA;
  panel.querySelectorAll('.site[data-kind="site"]').forEach(el=> el.onclick = ()=> selectSite(st,+el.dataset.i,el));
  panel.querySelectorAll('.site[data-kind="city"]').forEach(el=> el.onclick = ()=> selectCityFromList(st,+el.dataset.i,el));
}

/* ---- photo gallery: fetched live from Wikipedia's media-list API - */
function ensureGallery(el){
  if(!el) return;
  const g = el.querySelector('.gallery');
  if(!g || g.dataset.loaded==='1') return;
  g.dataset.loaded = '1';
  const s = CURRENT_STATE.sites[+el.dataset.i];
  loadGalleryImages(g, s.wiki||s.name, s.name);
}
async function loadGalleryImages(container, title, altFallback){
  if(IMAGE_CACHE[title]){ renderGallery(container, IMAGE_CACHE[title]); return; }
  container.innerHTML = `<div class="gallery-status">Loading photos…</div>`;
  try{
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(title)}`);
    if(!res.ok) throw new Error('no media-list for '+title);
    const data = await res.json();
    const images = (data.items||[])
      .filter(it=>it.type==='image' && Array.isArray(it.srcset) && it.srcset.length)
      .slice(0,6)
      .map(it=>{
        const variant = it.srcset[Math.min(1,it.srcset.length-1)];
        let src = variant.src; if(src.startsWith('//')) src = 'https:'+src;
        const alt = (it.title||altFallback).replace(/^File:/,'').replace(/\.[a-zA-Z0-9]+$/,'');
        return { src, alt };
      });
    IMAGE_CACHE[title] = images;
    renderGallery(container, images);
  }catch(e){
    IMAGE_CACHE[title] = [];
    renderGallery(container, []);
  }
}
function renderGallery(container, images){
  if(!images.length){
    container.innerHTML = `<div class="gallery-status">No photos available yet.</div>`;
    return;
  }
  container.innerHTML = `
    <div class="gallery-track">${images.map(im=>
      `<div class="gallery-slide"><img src="${im.src}" alt="${esc(im.alt)}" loading="lazy"
        onerror="this.closest('.gallery-slide').remove()"></div>`).join('')}</div>
    ${images.length>1 ? `
      <button class="gallery-nav prev" aria-label="Previous photo">‹</button>
      <button class="gallery-nav next" aria-label="Next photo">›</button>
      <div class="gallery-dots">${images.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join('')}</div>` : ''}`;
  const track = container.querySelector('.gallery-track');
  const dots  = container.querySelectorAll('.gallery-dots span');
  const prev  = container.querySelector('.gallery-nav.prev');
  const next  = container.querySelector('.gallery-nav.next');
  const go = delta => track.scrollBy({ left: track.clientWidth*delta, behavior:'smooth' });
  if(prev) prev.onclick = ()=>go(-1);
  if(next) next.onclick = ()=>go(1);
  track.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.preventDefault(); track.scrollLeft += e.deltaY; }
  }, { passive:false });
  track.addEventListener('scroll', ()=>{
    const idx = Math.round(track.scrollLeft/track.clientWidth);
    dots.forEach((d,i)=>d.classList.toggle('on', i===idx));
  });
}

/* ---- selection flow -------------------------------------------- */
function selectState(st, focusIndex, cityFocusIndex){
  setBase('sat');                         // crisp detail when exploring
  CURRENT_STATE = st;
  siteLayer.clearLayers(); siteMarkers={};
  cityLayer.clearLayers(); cityMarkers={}; cityHighlight.clearLayers();
  renderState(st);
  showPanel();
  const sites = st.sites||[];
  const cities = st.cities||[];
  const pts=[];
  sites.forEach((s,i)=>{
    const m=L.marker([s.lat,s.lng],{icon:siteIcon()}).addTo(siteLayer)
      .bindPopup(`<div class="pop-name">${esc(s.name)}</div>
                  <div class="pop-est">${esc(s.est)}</div>
                  <div class="pop-body">${esc(s.fact)}</div>`,{maxWidth:260});
    m.on('click',()=>highlightListItem(i));
    siteMarkers[i]=m; pts.push([s.lat,s.lng]);
  });
  cities.forEach((c,i)=>{
    const m=L.marker([c.lat,c.lng],{icon:cityIcon()}).addTo(cityLayer)
      .bindPopup(`<div class="pop-name">${esc(c.name)}</div>
                  <div class="pop-est">Founded ${esc(c.founded)}</div>
                  <div class="pop-body">${esc(c.fact)}</div>`,{maxWidth:260});
    m.on('click',()=>highlightCityFromMap(st,i));
    cityMarkers[i]=m; pts.push([c.lat,c.lng]);
  });
  if(focusIndex!=null && sites[focusIndex]){
    const s=sites[focusIndex];
    map.flyTo([s.lat,s.lng],13,{duration:1.15});
    setTimeout(()=>{ siteMarkers[focusIndex].openPopup(); openListItem(focusIndex); },700);
  }else if(cityFocusIndex!=null && cities[cityFocusIndex]){
    setTimeout(()=> selectCityFromList(st,cityFocusIndex,
      panel.querySelector(`.site[data-kind="city"][data-i="${cityFocusIndex}"]`)),700);
  }else if(pts.length){
    map.flyToBounds(L.latLngBounds(pts).pad(0.4),
      {maxZoom:11,duration:1.1,paddingTopLeft:[0,60],paddingBottomRight:[panelPad(),0]});
  }else{
    map.flyTo([st.lat,st.lng],6,{duration:1.1});
  }
}
function selectSite(st,i,el){
  const opened=el.classList.contains('open');
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  if(!opened){ el.classList.add('open'); ensureGallery(el); }
  cityHighlight.clearLayers();
  const m=siteMarkers[i];
  if(m){ map.flyTo([st.sites[i].lat,st.sites[i].lng],13,{duration:1}); m.openPopup(); }
}
function openListItem(i){
  const el=panel.querySelector(`.site[data-kind="site"][data-i="${i}"]`); if(!el) return;
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'center'});
  ensureGallery(el);
}
function highlightListItem(i){ cityHighlight.clearLayers(); openListItem(i); }

/* ---- city selection: outline + list sync ------------------------ */
function drawCityOutline(c){
  cityHighlight.clearLayers();
  L.circle([c.lat,c.lng],{
    radius:c.radius||9000, color:'#6FA8DC', weight:2.5, opacity:.9,
    fillColor:'#6FA8DC', fillOpacity:.12, dashArray:'6 5'
  }).addTo(cityHighlight);
}
function openCityListItem(i){
  const el=panel.querySelector(`.site[data-kind="city"][data-i="${i}"]`); if(!el) return;
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'center'});
}
function selectCityFromList(st,i,el){
  const c = st.cities[i];
  const opened = el && el.classList.contains('open');
  panel.querySelectorAll('.site').forEach(s=>s.classList.remove('open'));
  if(el && !opened) el.classList.add('open');
  else if(!el) openCityListItem(i);
  drawCityOutline(c);
  map.flyTo([c.lat,c.lng],12,{duration:1});
  const m=cityMarkers[i]; if(m) m.openPopup();
}
function highlightCityFromMap(st,i){
  drawCityOutline(st.cities[i]);
  openCityListItem(i);
}
function resetToUSA(){
  siteLayer.clearLayers(); siteMarkers={};
  cityLayer.clearLayers(); cityMarkers={}; cityHighlight.clearLayers();
  map.flyTo(USA_VIEW.center,USA_VIEW.zoom,{duration:1.1});
  renderHome();
  hidePanel();
}

/* ---- boot ------------------------------------------------------ */
STATES.forEach(st=>{
  L.marker([st.lat,st.lng],{icon:stateIcon(st.abbr),title:st.name})
    .addTo(stateLayer).on('click',()=>selectState(st));
});
renderHome();
document.getElementById('search-fab').onclick = ()=>{ renderHome(); showPanel(); };
</script>
